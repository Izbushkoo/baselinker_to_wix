{% extends "base.html" %}

{% block title %}Добавить товар - Werehouse{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 py-8">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="bg-white rounded-lg shadow px-6 py-8">
            <div class="mb-8">
                <h1 class="text-2xl font-bold text-gray-900">Добавить новый товар</h1>
                <p class="mt-2 text-sm text-gray-500">Заполните форму для добавления нового товара на склад</p>
            </div>

            <form id="productForm" class="space-y-6">
                <!-- Основная информация -->
                <div class="space-y-4">
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700">Название товара</label>
                        <input type="text" 
                               name="name" 
                               id="name" 
                               required 
                               class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
                    </div>

                    <div>
                        <label for="sku" class="block text-sm font-medium text-gray-700">SKU</label>
                        <input type="text" 
                               name="sku" 
                               id="sku" 
                               required 
                               placeholder="Введите уникальный идентификатор товара"
                               class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
                    </div>

                    <div>
                        <label for="ean" class="block text-sm font-medium text-gray-700">EAN (штрихкод)</label>
                        <input type="text" 
                               name="ean" 
                               id="ean" 
                               placeholder="Введите один или несколько штрихкодов через запятую"
                               class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
                    </div>
                </div>

                <!-- Склад и количество -->
                <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <div>
                        <label for="warehouse" class="block text-sm font-medium text-gray-700">Склад</label>
                        <select name="warehouse" 
                                id="warehouse" 
                                required 
                                class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
                            <option value="">Выберите склад</option>
                            {% for warehouse in warehouses %}
                            <option value="{{ warehouse }}">{{ warehouse }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label for="quantity" class="block text-sm font-medium text-gray-700">Количество</label>
                        <input type="number" 
                               name="quantity" 
                               id="quantity" 
                               required 
                               min="0" 
                               class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
                    </div>
                </div>

                <!-- Изображение -->
                <div>
                    <label for="image" class="block text-sm font-medium text-gray-700">Изображение товара</label>
                    <div class="mt-1 flex items-center">
                        <div id="imagePreview" class="hidden mr-4 w-20 h-20 rounded-lg bg-gray-100 flex items-center justify-center">
                            <img src="" alt="Preview" class="max-w-full max-h-full object-contain">
                        </div>
                        <label class="relative cursor-pointer bg-white rounded-md font-medium text-blue-600 hover:text-blue-500 focus-within:outline-none focus-within:ring-2 focus-within:ring-offset-2 focus-within:ring-blue-500">
                            <span class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">
                                <svg class="w-5 h-5 mr-2 -ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                </svg>
                                Выбрать изображение
                            </span>
                            <input type="file" 
                                   name="image" 
                                   id="image" 
                                   accept="image/*"
                                   class="sr-only">
                        </label>
                    </div>
                    <p class="mt-2 text-sm text-gray-500">PNG, JPG или GIF до 1MB</p>
                </div>

                <!-- Кнопки -->
                <div class="flex justify-end space-x-3">
                    <button type="button" id="cancelBtn"
                       class="inline-flex justify-center rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2">
                        Отмена
                    </button>
                    <button type="submit" 
                            class="inline-flex justify-center rounded-md border border-transparent bg-blue-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                        Добавить товар
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('productForm');
    const imageInput = document.getElementById('image');
    const imagePreview = document.getElementById('imagePreview');
    
    // Функция для получения параметров из URL
    function getUrlParameter(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
    }
    
    // Упрощенная и надежная функция для получения URL для возврата
    function getReturnUrl() {
        // Приоритет 1: параметр next из URL (если явно указан)
        const nextUrl = getUrlParameter('next');
        if (nextUrl) {
            try {
                const decodedUrl = decodeURIComponent(nextUrl);
                // Проверяем, что URL безопасен (начинается с /)
                if (decodedUrl.startsWith('/')) {
                    console.log('Возврат по параметру next:', decodedUrl);
                    return decodedUrl;
                }
            } catch (e) {
                console.warn('Ошибка декодирования параметра next:', e);
            }
        }
        
        // Приоритет 2: возврат на страницу, с которой пришел пользователь (document.referrer)
        if (document.referrer) {
            const referrerUrl = new URL(document.referrer);
            const currentUrl = new URL(window.location.href);
            
            // Проверяем, что referrer не является текущей страницей и с того же домена
            if (referrerUrl.pathname !== currentUrl.pathname && referrerUrl.hostname === currentUrl.hostname) {
                const returnUrl = referrerUrl.pathname + referrerUrl.search;
                console.log('Возврат на страницу, с которой пришел пользователь:', returnUrl);
                return returnUrl;
            }
        }
        
        // Приоритет 3: по умолчанию возвращаемся в каталог
        console.log('Возврат в каталог (по умолчанию)');
        return '/catalog';
    }
    
    // Предзаполнение полей из URL параметров
    function prefillFields() {
        const sku = getUrlParameter('sku');
        const name = getUrlParameter('name');
        const quantity = getUrlParameter('quantity');
        
        if (sku) {
            document.getElementById('sku').value = sku;
        }
        if (name) {
            document.getElementById('name').value = name;
        }
        if (quantity) {
            document.getElementById('quantity').value = quantity;
        }
        
        // Если есть предзаполненные данные, показываем уведомление
        if (sku || name || quantity) {
            showPrefillNotification();
        }
    }
    
    // Показываем уведомление о предзаполнении
    function showPrefillNotification() {
        const notification = document.createElement('div');
        notification.className = 'fixed top-4 right-4 bg-blue-600 text-white px-4 py-2 rounded-lg shadow-lg z-50 transition-opacity duration-300';
        notification.innerHTML = `
            <div class="flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span>Поля предзаполнены данными из операции.</span>
            </div>
        `;
        document.body.appendChild(notification);
        
        setTimeout(() => {
            notification.style.opacity = '0';
            setTimeout(() => {
                if (notification.parentNode) {
                    notification.parentNode.removeChild(notification);
                }
            }, 300);
        }, 5000);
    }
    
    // Предзаполняем поля при загрузке страницы
    prefillFields();
    
    // Предпросмотр изображения
    imageInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                imagePreview.querySelector('img').src = e.target.result;
                imagePreview.classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }
    });
    
    // Обработчик кнопки "Отмена"
    document.getElementById('cancelBtn').addEventListener('click', function() {
        const returnUrl = getReturnUrl();
        console.log('Отмена - переход на:', returnUrl);
        window.location.href = returnUrl;
    });
    
    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const formData = new FormData(form);
        
        try {
            const response = await fetch('/api/products', {
                method: 'POST',
                body: formData
            });
            
            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.detail || 'Ошибка при добавлении товара');
            }
            
            const result = await response.json();
            if (result.success) {
                // Показываем уведомление об успехе
                showSuccessNotification();
                
                // Небольшая задержка перед переходом для показа уведомления
                setTimeout(() => {
                    const returnUrl = getReturnUrl();
                    console.log('Успешное создание товара - переход на:', returnUrl);
                    window.location.href = returnUrl;
                }, 1000);
            }
        } catch (error) {
            console.error('Ошибка:', error);
            showErrorNotification(error.message || 'Произошла ошибка при добавлении товара. Пожалуйста, попробуйте еще раз.');
        }
    });
    
    // Функция показа уведомления об успехе
    function showSuccessNotification() {
        const notification = document.createElement('div');
        notification.className = 'fixed top-4 right-4 bg-green-600 text-white px-4 py-2 rounded-lg shadow-lg z-50';
        notification.innerHTML = `
            <div class="flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
                <span>Товар успешно создан! Переход на предыдущую страницу...</span>
            </div>
        `;
        document.body.appendChild(notification);
        
        setTimeout(() => {
            if (notification.parentNode) {
                notification.parentNode.removeChild(notification);
            }
        }, 3000);
    }
    
    // Функция показа уведомления об ошибке
    function showErrorNotification(message) {
        const notification = document.createElement('div');
        notification.className = 'fixed top-4 right-4 bg-red-600 text-white px-4 py-2 rounded-lg shadow-lg z-50';
        notification.innerHTML = `
            <div class="flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
                <span>${message}</span>
            </div>
        `;
        document.body.appendChild(notification);
        
        setTimeout(() => {
            if (notification.parentNode) {
                notification.parentNode.removeChild(notification);
            }
        }, 5000);
    }
});
</script>
{% endblock %}
