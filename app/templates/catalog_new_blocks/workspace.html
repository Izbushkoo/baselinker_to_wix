<!-- Основной контейнер воркспейса -->
<div id="workspaceContainer" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden">
    <div class="flex h-full pt-16">
        <!-- Левая панель - Воркспейс -->
        <div id="workspacePanel" class="w-1/2 bg-white shadow-2xl flex flex-col">
            <!-- Заголовок воркспейса -->
            <div class="bg-gray-800 text-white p-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10">
                        </path>
                    </svg>
                    <div class="flex flex-col">
                        <h2 class="text-xl font-semibold">Воркспейс</h2>
                        <span id="workspaceUserInfo" class="text-xs text-gray-300 opacity-75"></span>
                    </div>
                    <span id="workspacePanelCount"
                        class="bg-blue-500 text-white text-sm rounded-full px-2 py-1">0</span>
                </div>
                <div class="flex items-center gap-2">
                    <!-- Бургер-меню действий -->
                    <div class="relative">
                        <button id="workspaceActionsBtn" onclick="toggleActionsMenu()"
                            class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-sm transition-colors flex items-center gap-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                            </svg>
                            Действия
                        </button>
                        
                        <!-- Выпадающее меню действий -->
                        <div id="workspaceActionsMenu" class="absolute right-0 top-full mt-1 w-80 bg-white rounded-lg shadow-lg border border-gray-200 hidden z-50">
                            <div class="p-2">
                                <!-- Экспорт -->
                                <div class="mb-2">
                                    <div class="text-xs font-semibold text-gray-500 uppercase tracking-wide px-3 py-2">Экспорт</div>
                                    <button onclick="exportWithImages()" 
                                        class="w-full text-left px-3 py-2 text-sm text-gray-700 hover:bg-gray-100 rounded flex items-center gap-2">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                                        </svg>
                                        Экспорт остатков с изображениями
                                    </button>
                                    <button onclick="exportWithoutImages()" 
                                        class="w-full text-left px-3 py-2 text-sm text-gray-700 hover:bg-gray-100 rounded flex items-center gap-2">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                                        </svg>
                                        Экспорт остатков без изображений
                                    </button>
                                </div>

                                <!-- Синхронизация (только для админов) -->
                                <div class="mb-2" id="syncSection">
                                    <div class="text-xs font-semibold text-gray-500 uppercase tracking-wide px-3 py-2">Синхронизация</div>
                                    <button onclick="enableSync()" 
                                        class="w-full text-left px-3 py-2 text-sm text-gray-700 hover:bg-gray-100 rounded flex items-center gap-2">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                        </svg>
                                        Включить синхронизацию остатков
                                    </button>
                                    <button onclick="disableSync()" 
                                        class="w-full text-left px-3 py-2 text-sm text-gray-700 hover:bg-gray-100 rounded flex items-center gap-2">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M7 7l.01.01M7 3h4a1 1 0 011 1v4M3 7v4a1 1 0 001 1h4"></path>
                                        </svg>
                                        Выключить синхронизацию остатков
                                    </button>
                                </div>

                                <!-- Заявки на перемещение -->
                                <div class="mb-2">
                                    <div class="text-xs font-semibold text-gray-500 uppercase tracking-wide px-3 py-2">Заявки на перемещение</div>
                                    <button onclick="createTransferRequest()" 
                                        class="w-full text-left px-3 py-2 text-sm text-gray-700 hover:bg-gray-100 rounded flex items-center gap-2">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                                        </svg>
                                        Создать файл заявки для выбранных
                                    </button>
                                </div>

                                <!-- Заявки поставщику (только для админов) -->
                                <div class="mb-2" id="supplierRequestsSection">
                                    <div class="text-xs font-semibold text-gray-500 uppercase tracking-wide px-3 py-2">Заявки поставщику</div>
                                    <button onclick="createSupplierRequest()" 
                                        class="w-full text-left px-3 py-2 text-sm text-gray-700 hover:bg-gray-100 rounded flex items-center gap-2">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                                        </svg>
                                        Создать файл заявки поставщику
                                    </button>
                                </div>

                                <!-- Управление товарами (только для админов) -->
                                <div class="mb-2" id="productManagementSection">
                                    <div class="text-xs font-semibold text-gray-500 uppercase tracking-wide px-3 py-2">Управление товарами</div>
                                    <button onclick="deleteSelectedProducts()" 
                                        class="w-full text-left px-3 py-2 text-sm text-red-600 hover:bg-red-50 rounded flex items-center gap-2">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                        </svg>
                                        Удалить выделенные товары из системы
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <button onclick="clearWorkspace()"
                        class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-sm transition-colors">
                        Очистить
                    </button>
                    <button onclick="toggleWorkspace()"
                        class="bg-gray-600 hover:bg-gray-700 text-white px-3 py-1 rounded text-sm transition-colors">
                        ✕
                    </button>
                </div>
            </div>

            <!-- Поиск в воркспейсе -->
            <div class="p-4 border-b">
                <div class="relative">
                    <input type="text" id="workspaceSearch" placeholder="Поиск в воркспейсе..."
                        class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    <svg class="absolute left-3 top-2.5 w-5 h-5 text-gray-400" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
            </div>

            <!-- Список товаров в воркспейсе -->
            <div class="flex-1 overflow-y-auto p-4">
                <div id="workspaceProductsList" class="space-y-3">
                    <!-- Товары будут добавляться динамически -->
                </div>

                <!-- Пустое состояние воркспейса -->
                <div id="workspaceEmptyState" class="text-center py-12">
                    <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10">
                        </path>
                    </svg>
                    <h3 class="mt-2 text-sm font-medium text-gray-900">Воркспейс пуст</h3>
                    <p class="mt-1 text-sm text-gray-500">Кликните по товарам в каталоге, чтобы добавить их сюда</p>
                </div>
            </div>
        </div>

        <!-- Правая панель - Каталог -->
        <div id="catalogPanel" class="w-1/2 bg-gray-50 overflow-y-auto relative">
            <!-- Контент каталога будет вставлен сюда -->
        </div>
    </div>
</div>

<script>
    // Простой класс для управления воркспейсом
    class SimpleWorkspaceManager {
        constructor() {
            // Получаем email пользователя для создания уникального ключа
            this.userEmail = this.getUserEmail();
            this.storageKey = `catalog_workspace_${this.userEmail}`;
            console.log(`Инициализация воркспейса для пользователя: ${this.userEmail}, ключ: ${this.storageKey}`);
            this.selectedProducts = this.loadFromStorage();
            this.isOpen = false;
            this.init();
        }

        // Получение email пользователя
        getUserEmail() {
            const userDataEl = document.getElementById('user-data');
            if (userDataEl) {
                const email = userDataEl.dataset.userEmail;
                if (email && email.trim() !== '') {
                    // Используем email как основу для ключа, заменяя @ и . на безопасные символы
                    return email.replace(/[@.]/g, '_');
                }
            }
            // Fallback для неавторизованных пользователей
            return 'anonymous';
        }

        init() {
            this.updateWorkspaceCount();
            this.updateUserInfo();
            this.setupEventListeners();
            this.highlightSelectedProducts();
        }

        // Обновление информации о пользователе
        updateUserInfo() {
            const userInfoEl = document.getElementById('workspaceUserInfo');
            if (userInfoEl) {
                if (this.userEmail === 'anonymous') {
                    userInfoEl.textContent = 'Неавторизованный пользователь';
                } else {
                    // Получаем оригинальный email из элемента user-data
                    const userDataEl = document.getElementById('user-data');
                    if (userDataEl) {
                        const originalEmail = userDataEl.dataset.userEmail;
                        userInfoEl.textContent = `Пользователь: ${originalEmail}`;
                    } else {
                        userInfoEl.textContent = `Пользователь: ${this.userEmail}`;
                    }
                }
            }
        }

        // Загрузка из localStorage
        loadFromStorage() {
            try {
                // Сначала пробуем загрузить с новым ключом (персональным)
                let data = localStorage.getItem(this.storageKey);
                
                // Если данных нет, пробуем загрузить со старого ключа (общего) для миграции
                if (!data && this.userEmail !== 'anonymous') {
                    const oldData = localStorage.getItem('catalog_workspace');
                    if (oldData) {
                        console.log(`Миграция воркспейса для пользователя ${this.userEmail}`);
                        data = oldData;
                        // Сохраняем в новый ключ и удаляем старый
                        localStorage.setItem(this.storageKey, data);
                        localStorage.removeItem('catalog_workspace');
                    }
                }
                
                return data ? JSON.parse(data) : {};
            } catch (error) {
                console.error('Ошибка при загрузке воркспейса:', error);
                return {};
            }
        }

        // Сохранение в localStorage
        saveToStorage() {
            try {
                localStorage.setItem(this.storageKey, JSON.stringify(this.selectedProducts));
                this.updateWorkspaceCount();
                this.highlightSelectedProducts();
            } catch (error) {
                console.error('Ошибка при сохранении воркспейса:', error);
            }
        }

        // Добавление товара в воркспейс
        addProduct(productData) {
            this.selectedProducts[productData.sku] = {
                ...productData,
                addedAt: new Date().toISOString()
            };
            this.saveToStorage();
            
            // Принудительно скрываем состояние пустого воркспейса
            const emptyState = document.getElementById('workspaceEmptyState');
            if (emptyState) {
                emptyState.classList.add('hidden');
            }
            
            this.renderWorkspaceProducts();

            // Принудительно обновляем подсветку с небольшой задержкой
            setTimeout(() => {
                this.highlightSelectedProducts();
                // Принудительно обновляем счетчик
                this.updateWorkspaceCount();
            }, 100);

            this.showNotification(`Товар "${productData.name}" добавлен в воркспейс`, 'success');
        }

        // Удаление товара из воркспейса
        removeProduct(sku) {
            if (this.selectedProducts[sku]) {
                const productName = this.selectedProducts[sku].name;

                delete this.selectedProducts[sku];
                this.saveToStorage();
                
                // Принудительно очищаем контейнер если воркспейс пуст
                if (Object.keys(this.selectedProducts).length === 0) {
                    const container = document.getElementById('workspaceProductsList');
                    if (container) {
                        container.innerHTML = '';
                    }
                    const emptyState = document.getElementById('workspaceEmptyState');
                    if (emptyState) {
                        emptyState.classList.remove('hidden');
                    }
                }
                
                this.renderWorkspaceProducts();

                // Принудительно обновляем подсветку с небольшой задержкой
                setTimeout(() => {
                    this.highlightSelectedProducts();
                }, 100);

                this.showNotification(`Товар "${productName}" удален из воркспейса`, 'info');
            }
        }

        // Очистка воркспейса
        clearWorkspace() {
            if (Object.keys(this.selectedProducts).length === 0) {
                this.showNotification('Воркспейс уже пуст', 'info');
                return;
            }

            const productCount = Object.keys(this.selectedProducts).length;
            if (confirm(`Вы уверены, что хотите очистить воркспейс? Будут удалены ${productCount} товаров.`)) {
                this.selectedProducts = {};
                this.saveToStorage();
                this.renderWorkspaceProducts();
                this.highlightSelectedProducts(); // Обновляем визуальное выделение
                this.showNotification('Воркспейс очищен', 'success');
            }
        }

        // Получение количества товаров
        getProductCount() {
            return Object.keys(this.selectedProducts).length;
        }

        // Обновление счетчика
        updateWorkspaceCount() {
            const count = this.getProductCount();
            const countElements = [
                document.getElementById('workspaceCount'),
                document.getElementById('workspacePanelCount')
            ];

            countElements.forEach(element => {
                if (element) {
                    if (count > 0) {
                        element.textContent = count;
                        element.classList.remove('hidden');
                    } else {
                        element.classList.add('hidden');
                    }
                }
            });

        }

        // Подсветка выбранных товаров в каталоге
        highlightSelectedProducts() {
            // Убираем старую подсветку со всех карточек
            const allCards = document.querySelectorAll('.product-card');
            allCards.forEach(card => {
                card.classList.remove('workspace-selected');
            });

            // Принудительно обновляем стили через небольшую задержку
            setTimeout(() => {
                // Добавляем подсветку выбранным товарам
                Object.keys(this.selectedProducts).forEach(sku => {
                    // Ищем карточки в основном каталоге
                    const mainCards = document.querySelectorAll(`#mainContent [data-product-sku="${sku}"]`);
                    mainCards.forEach(card => {
                        const productCard = card.closest('.product-card');
                        if (productCard && !productCard.closest('#workspaceProductsList')) {
                            productCard.classList.add('workspace-selected');
                        }
                    });

                    // Ищем карточки в правой панели воркспейса
                    const catalogCards = document.querySelectorAll(`#catalogPanel [data-product-sku="${sku}"]`);
                    catalogCards.forEach(card => {
                        const productCard = card.closest('.product-card');
                        if (productCard && !productCard.closest('#workspaceProductsList')) {
                            productCard.classList.add('workspace-selected');
                        }
                    });
                });
            }, 10);
        }



        // Рендеринг товаров в воркспейсе
        async renderWorkspaceProducts() {
            const container = document.getElementById('workspaceProductsList');
            const emptyState = document.getElementById('workspaceEmptyState');

            if (!container) return;

            const skus = Object.keys(this.selectedProducts);

            if (skus.length === 0) {
                container.innerHTML = '';
                if (emptyState) emptyState.classList.remove('hidden');
                return;
            }

            if (emptyState) emptyState.classList.add('hidden');

            // Загружаем все карточки одним запросом
            try {
                const response = await fetch('/catalog_new/api/workspace-cards', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(skus)
                });

                if (response.ok) {
                    const data = await response.json();
                    container.innerHTML = data.html;
                    
                    // Переинициализируем drag-and-drop для новых карточек в воркспейсе
                    if (typeof window.reinitializeDragAndDrop === 'function') {
                        setTimeout(() => {
                            window.reinitializeDragAndDrop();
                        }, 100);
                    }
                } else {
                    // Fallback: показываем простые карточки
                    container.innerHTML = skus.map(sku => this.generateFallbackCard(this.selectedProducts[sku])).join('');
                }

            } catch (error) {
                console.error('Ошибка при загрузке карточек воркспейса:', error);
                container.innerHTML = skus.map(sku => this.generateFallbackCard(this.selectedProducts[sku])).join('');
                
                // Переинициализируем drag-and-drop даже для fallback карточек
                if (typeof window.reinitializeDragAndDrop === 'function') {
                    setTimeout(() => {
                        window.reinitializeDragAndDrop();
                    }, 100);
                }
            }
        }

        // Модификация карточки для воркспейса
        modifyCardForWorkspace(html, sku) {
            // Создаем временный элемент для парсинга HTML
            const temp = document.createElement('div');
            temp.innerHTML = html;

            const card = temp.querySelector('.product-card');
            if (card) {
                // Убираем подсветку выбранности
                card.classList.remove('workspace-selected');

                // Добавляем кнопку удаления в левый верхний угол
                const deleteButton = document.createElement('button');
                deleteButton.className = 'absolute top-2 left-2 bg-red-500 hover:bg-red-600 text-white rounded-full w-8 h-8 flex items-center justify-center text-lg font-bold transition-colors z-10 shadow-lg';
                deleteButton.innerHTML = '×';
                deleteButton.setAttribute('data-sku', sku);
                deleteButton.title = 'Удалить из воркспейса';

                // Убеждаемся, что карточка имеет относительное позиционирование
                card.style.position = 'relative';

                card.appendChild(deleteButton);

                // Убираем обработчики кликов и меняем курсор
                card.onclick = null;
                card.style.cursor = 'default';

                // Убираем все data-атрибуты, чтобы избежать случайного выделения
                card.removeAttribute('data-product-sku');
                card.removeAttribute('data-product-name');
            }

            return temp.innerHTML;
        }

        // Fallback карточка
        generateFallbackCard(product) {
            return `
            <div class="product-card bg-white rounded-lg shadow-sm border border-gray-200 p-4 relative">
                <button class="absolute top-2 left-2 bg-red-500 hover:bg-red-600 text-white rounded-full w-8 h-8 flex items-center justify-center text-lg font-bold transition-colors z-10 shadow-lg"
                        data-sku="${product.sku}"
                        title="Удалить из воркспейса">×</button>
                <div class="ml-10">
                    <h3 class="font-bold text-gray-900">${product.name || 'Неизвестный товар'}</h3>
                    <p class="text-sm text-gray-600">SKU: ${product.sku}</p>
                    <p class="text-sm text-gray-600">Остаток: ${product.stock || 0} шт.</p>
                </div>
            </div>
        `;
        }

        // Настройка обработчиков событий
        setupEventListeners() {
            // Поиск в воркспейсе
            const searchInput = document.getElementById('workspaceSearch');
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    this.filterWorkspaceProducts(e.target.value);
                });
            }
        }

        // Переключение товара в воркспейсе
        toggleProduct(card) {
            const sku = card.dataset.productSku;

            if (this.selectedProducts[sku]) {
                // Товар уже в воркспейсе - удаляем
                this.removeProduct(sku);
            } else {
                // Товар не в воркспейсе - добавляем
                const productData = this.extractProductData(card);
                if (productData) {
                    this.addProduct(productData);
                }
            }
        }

        // Извлечение данных товара из карточки
        extractProductData(card) {
            const sku = card.dataset.productSku;
            if (!sku) return null;

            return {
                sku: sku,
                name: card.dataset.productName || card.querySelector('h3')?.textContent?.trim() || 'Неизвестный товар',
                brand: card.dataset.productBrand || '',
                ean: card.dataset.productEan || '',
                stock: parseInt(card.dataset.productStock) || 0,
                price: parseFloat(card.dataset.productPrice) || 0,
                category: card.dataset.productCategory || '',
                id: card.dataset.productId || ''
            };
        }

        // Фильтрация товаров в воркспейсе
        filterWorkspaceProducts(searchTerm) {
            const products = document.querySelectorAll('#workspaceProductsList .product-card');
            const term = searchTerm.toLowerCase();

            products.forEach(product => {

    // Переключение воркспейса (универсальная версия для всех страниц)
    function toggleWorkspace() {
        // Убеждаемся, что воркспейс инициализирован
        initializeWorkspace();
        
        const container = document.getElementById('workspaceContainer');
        const catalogPanel = document.getElementById('catalogPanel');
        
        // Ищем основной контент страницы - пробуем разные варианты
        let mainContent = document.getElementById('mainContent') || 
                         document.querySelector('main') || 
                         document.querySelector('.main-content') ||
                         document.querySelector('.content') ||
                         document.body;

        if (!container || !catalogPanel) {
            console.error('Не найдены необходимые элементы для воркспейса');
            return;
        }

        if (workspaceManager && workspaceManager.isOpen) {
            // Закрываем воркспейс
            container.classList.add('hidden');
            catalogPanel.innerHTML = '';
            if (mainContent && mainContent.id === 'mainContent') {
                mainContent.classList.remove('hidden');
            }
            workspaceManager.isOpen = false;
        } else {
            // Открываем воркспейс
            container.classList.remove('hidden');

            // Копируем контент текущей страницы в правую панель
            if (mainContent) {
                catalogPanel.innerHTML = `
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
                        ${mainContent.innerHTML}
                    </div>
                `;
                
            } else {
                catalogPanel.innerHTML = `
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
                        <p class="text-gray-500">Контент страницы не найден</p>
                    </div>
                `;
            }

            if (mainContent && mainContent.id === 'mainContent') {
                mainContent.classList.add('hidden');
            }

            if (workspaceManager) {
                workspaceManager.isOpen = true;
                // Принудительно обновляем UI воркспейса
                setTimeout(() => {
                    workspaceManager.renderWorkspaceProducts();
                    workspaceManager.highlightSelectedProducts();
                    workspaceManager.updateWorkspaceCount();
                }, 100);
            }
        }
    }

    async function deleteSelectedProducts() {
        initializeWorkspace();
        if (!workspaceManager || workspaceManager.getProductCount() === 0) {
            showNotification('Воркспейс пуст. Добавьте товары для удаления.', 'warning');
            return;
        }
        
        const skus = Object.keys(workspaceManager.selectedProducts);
        const productNames = Object.values(workspaceManager.selectedProducts).map(p => p.name);
        
        // Создаем детальное предупреждение
        const productList = productNames.slice(0, 5).join(', ');
        const moreText = productNames.length > 5 ? ` и еще ${productNames.length - 5} товаров` : '';
        
        const confirmMessage = `ВНИМАНИЕ! Вы собираетесь удалить ${skus.length} товаров из системы:\n\n${productList}${moreText}\n\nЭто действие НЕОБРАТИМО и удалит:\n• Все данные о товарах\n• Все остатки на складах\n• Все связанные операции\n• Все настройки синхронизации\n\nВы уверены, что хотите продолжить?`;
        
        if (!confirm(confirmMessage)) {
            showNotification('Удаление отменено', 'info');
            return;
        }
        
        // Дополнительное подтверждение для большого количества товаров
        if (skus.length > 10) {
            const secondConfirm = confirm(`Вы действительно хотите удалить ${skus.length} товаров? Это действие нельзя отменить!`);
            if (!secondConfirm) {
                showNotification('Удаление отменено', 'info');
                return;
            }
        }
        
        
        try {
            showNotification(`Начинаем удаление ${skus.length} товаров из системы...`, 'info');
            
            const response = await fetch('/api/products/bulk-delete', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest'
                },
                body: JSON.stringify({ skus: skus })
            });
            
            if (response.ok) {
                const result = await response.json();
                
                // Показываем детальный результат
                if (result.total_failed === 0) {
                    showNotification(`Успешно удалено ${result.total_deleted} товаров из системы`, 'success');
                } else {
                    showNotification(`Удалено ${result.total_deleted} товаров, ошибок: ${result.total_failed}`, 'warning');
                    
                    // Показываем детали ошибок
                    if (result.failed_deletions && result.failed_deletions.length > 0) {
                        console.error('Ошибки удаления:', result.failed_deletions);
                        const errorDetails = result.failed_deletions.map(f => `${f.sku}: ${f.error}`).join('\n');
                        alert(`Ошибки при удалении:\n${errorDetails}`);
                    }
                }
                
                // Очищаем воркспейс после успешного удаления
                if (result.total_deleted > 0) {
                    workspaceManager.clearWorkspace();
                    showNotification('Воркспейс очищен после удаления товаров', 'info');
                    
                    // Перерисовываем каталог после удаления товаров
                    if (typeof handleFilterChange === 'function') {
                        handleFilterChange();
                        
                        // Прокручиваем каталог вверх после обновления
                        setTimeout(() => {
                            const catalogPanel = document.getElementById('catalogPanel');
                            const productsList = document.getElementById('productsList');
                            
                            if (catalogPanel) {
                                // Если воркспейс открыт, прокручиваем правую панель каталога
                                catalogPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
                            } else if (productsList) {
                                // Если воркспейс закрыт, прокручиваем основной список товаров
                                productsList.scrollIntoView({ behavior: 'smooth', block: 'start' });
                            } else {
                                // Fallback - прокручиваем страницу вверх
                                window.scrollTo({ top: 0, behavior: 'smooth' });
                            }
                        }, 500); // Небольшая задержка для завершения обновления каталога
                    } else {
                        window.location.reload();
                    }
                }
                
            } else {
                const errorData = await response.json();
                showNotification(`Ошибка удаления товаров: ${errorData.detail || 'Неизвестная ошибка'}`, 'error');
            }
        } catch (error) {
            console.error('Ошибка при удалении товаров:', error);
            showNotification('Ошибка при удалении товаров', 'error');
        }
        
        // Закрываем меню
        document.getElementById('workspaceActionsMenu').classList.add('hidden');
    }

    // Глобальная функция для инициализации воркспейса
    function initializeWorkspace() {
        if (!workspaceManager) {
            try {
                workspaceManager = new SimpleWorkspaceManager();
                window.workspaceManager = workspaceManager;
            } catch (error) {
                console.error('Ошибка при инициализации SimpleWorkspaceManager:', error);
            }
        }
        
        // Скрываем блоки только для админов
        hideAdminOnlySections();
        
        return workspaceManager;
    }

    // Инициализация при загрузке страницы
    document.addEventListener('DOMContentLoaded', function () {

        // Инициализируем воркспейс
        initializeWorkspace();

        // Скрываем блоки только для админов (дополнительная проверка)
        hideAdminOnlySections();

        // Обновляем подсветку после инициализации
        setTimeout(() => {
            if (workspaceManager) {
                workspaceManager.highlightSelectedProducts();
            }
        }, 200);
    });
