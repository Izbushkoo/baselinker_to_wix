<!-- Слайдер фильтров (фиксированный снизу) -->
<div id="filterSlider" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg transform translate-y-full transition-transform duration-300 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
        <!-- Кнопка закрытия -->
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-semibold text-gray-900">Фильтры</h3>
            <button onclick="toggleFilterSlider()" class="text-gray-400 hover:text-gray-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        
        <!-- Фильтры -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-4">
            <!-- Поиск -->
            <div class="col-span-1 sm:col-span-2">
                <label class="block text-sm font-medium text-gray-700 mb-2">Поиск</label>
                <input type="text"
                       id="searchInput"
                       placeholder="По названию, SKU, EAN"
                       value="{{ filters.search }}"
                       oninput="handleFilterChange()"
                       class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
            </div>
            
            <!-- Минимальный остаток -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Мин. остаток</label>
                <input type="number"
                       id="minStockFilter"
                       placeholder="Мин."
                       value="{{ filters.min_stock_filter or '' }}"
                       oninput="handleFilterChange()"
                       class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-center"
                       min="0"
                       max="999">
            </div>
            
            <!-- Максимальный остаток -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Макс. остаток</label>
                <input type="number"
                       id="stockFilter"
                       placeholder="Макс."
                       value="{{ filters.stock_filter or '' }}"
                       oninput="handleFilterChange()"
                       class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-center"
                       min="0"
                       max="999">
            </div>
            
            <!-- Фильтр по бренду -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Бренд</label>
                <select id="brandFilter"
                        onchange="handleFilterChange()"
                        class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                    <option value="">Все бренды</option>
                    <!-- Бренды будут загружены динамически -->
                </select>
            </div>
            
            <!-- Сортировка -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Сортировка</label>
                <select id="sortOrder"
                        onchange="handleFilterChange()"
                        class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                    <option value="">По умолчанию</option>
                    <option value="asc" {% if filters.sort_order == 'asc' %}selected{% endif %}>По возрастанию</option>
                    <option value="desc" {% if filters.sort_order == 'desc' %}selected{% endif %}>По убыванию</option>
                </select>
            </div>
        </div>
        
        <!-- Дополнительные настройки -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-4 pt-4 border-t border-gray-200">
            <!-- Размер страницы -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Товаров на странице</label>
                <select id="pageSize"
                        onchange="handleFilterChange()"
                        class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                    <option value="50" {% if filters.page_size == 50 %}selected{% endif %}>50 товаров</option>
                    <option value="100" {% if filters.page_size == 100 %}selected{% endif %}>100 товаров</option>
                    <option value="500" {% if filters.page_size == 500 %}selected{% endif %}>500 товаров</option>
                    <option value="1000" {% if filters.page_size == 1000 %}selected{% endif %}>1000 товаров</option>
                </select>
            </div>
            
            <!-- Кнопки управления -->
            <div class="flex items-end gap-2">
                <button onclick="resetFilters()" 
                        class="px-4 py-2 text-gray-700 bg-gray-200 rounded-lg hover:bg-gray-300 transition-colors">
                    Сбросить
                </button>
                <button onclick="applyFilters()" 
                        class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                    Применить
                </button>
            </div>
            
            <!-- Счетчик результатов -->
            <div class="flex items-end justify-end">
                <span class="text-sm text-gray-600">
                    Найдено товаров: <span id="resultsCount">{{ products|length }}</span>
                </span>
            </div>
        </div>
    </div>
</div>
