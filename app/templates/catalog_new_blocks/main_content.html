<!-- Основной контент каталога -->
<div id="mainContent" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <!-- Заголовок и кнопки действий -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">Каталог товаров</h1>
            <p class="text-sm text-gray-600 mt-1">Управление товарами и остатками</p>
        </div>
        <div class="flex flex-wrap gap-3 mt-4 sm:mt-0">
            
            <!-- Кнопка принудительной синхронизации остатков -->
            {% if user.is_admin %}
            <button id="forceSyncBtn" 
                    class="flex items-center px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors"
                    onclick="forceSyncAllStocks()"
                    title="Принудительная синхронизация остатков всех аккаунтов (игнорирует флаги включения)">
                <svg class="w-5 h-5 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                </svg>
                <span>Принудительная синхронизация остатков</span>
            </button>
            {% endif %}
            
            <!-- Кнопка добавления товара -->
            <a href="/products/add" 
               class="flex items-center px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition-colors">
                <svg class="w-5 h-5 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                <span>Добавить товар</span>
            </a>
        </div>
    </div>

    <!-- Основной список товаров -->
    <div id="productsList" class="grid grid-cols-1 gap-4 mb-8">
        {% for product in products %}
        {% include "catalog_new_blocks/product_card.html" %}
        {% endfor %}
    </div>
</div>
