<style>
/* Стили для спиннера загрузки каталога */
.catalog-loading-spinner {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7); /* Темный фон для затемнения */
    display: none; /* По умолчанию скрыт */
    justify-content: center;
    align-items: center;
    z-index: 50; /* Высокий z-index для отображения поверх всего контента */
    backdrop-filter: blur(3px);
}

.catalog-loading-spinner:not(.hidden) {
    display: flex; /* Показываем только когда не скрыт */
}

.catalog-spinner-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
}

.catalog-spinner {
    width: 50px;
    height: 50px;
    border: 4px solid #f3f3f3;
    border-top: 4px solid #3498db;
    border-radius: 50%;
    animation: catalog-spin 1s linear infinite;
}

.catalog-spinner-text {
    color: white;
    font-size: 18px;
    font-weight: 500;
    text-align: center;
}

.catalog-spinner-subtext {
    color: #b0b0b0;
    font-size: 14px;
    text-align: center;
    margin-top: 5px;
}

@keyframes catalog-spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

/* Пульсирующая анимация для текста */
.catalog-pulse-text {
    animation: catalog-pulse 2s ease-in-out infinite;
}

@keyframes catalog-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
}
</style>

<script>
    // Версия скрипта для принудительного обновления кэша

    let searchTimeout;
    let currentFilters = {
        search: '{{ filters.search }}',
        sku_search: '{{ filters.sku_search or "" }}',
        stock_filter: '{{ filters.stock_filter or "null" }}',
        min_stock_filter: '{{ filters.min_stock_filter or "null" }}',
        brand_filter: '{{ filters.brand_filter }}',
        sort_order: '{{ filters.sort_order }}',
        page_size: '{{ filters.page_size }}'
    };

    // Функция для получения email пользователя (дублируем из workspace.html)
    function getUserEmail() {
        const userDataEl = document.getElementById('user-data');
        if (userDataEl) {
            const email = userDataEl.dataset.userEmail;
            if (email && email.trim() !== '') {
                return email.replace(/[@.]/g, '_');
            }
        }
        return 'anonymous';
    }

    // Функция для сохранения фильтров в localStorage (персонально для пользователя)
    function saveFiltersToStorage() {
        try {
            const userEmail = getUserEmail();
            const storageKey = `catalog_filters_${userEmail}`;
            
            const filtersToSave = {
                search: document.getElementById('searchInput')?.value || '',
                sku_search: document.getElementById('skuSearchInput')?.value || '',
                stock_filter: document.getElementById('stockFilter')?.value || '',
                min_stock_filter: document.getElementById('minStockFilter')?.value || '',
                brand_filter: document.getElementById('brandFilter')?.value || '',
                sort_order: document.getElementById('sortOrder')?.value || '',
                page_size: document.getElementById('pageSize')?.value || '50'
            };
            localStorage.setItem(storageKey, JSON.stringify(filtersToSave));
            console.log(`Фильтры сохранены в localStorage для пользователя ${userEmail}:`, filtersToSave);
        } catch (error) {
            console.error('Ошибка при сохранении фильтров:', error);
        }
    }

    // Функция для восстановления фильтров из localStorage (персонально для пользователя)
    function restoreFiltersFromStorage() {
        try {
            const userEmail = getUserEmail();
            const storageKey = `catalog_filters_${userEmail}`;
            
            // Сначала пробуем загрузить с новым ключом (персональным)
            let savedFilters = localStorage.getItem(storageKey);
            
            // Если данных нет, пробуем загрузить со старого ключа (общего) для миграции
            if (!savedFilters && userEmail !== 'anonymous') {
                const oldData = localStorage.getItem('catalog_filters');
                if (oldData) {
                    console.log(`Миграция фильтров для пользователя ${userEmail}`);
                    savedFilters = oldData;
                    // Сохраняем в новый ключ и удаляем старый
                    localStorage.setItem(storageKey, savedFilters);
                    localStorage.removeItem('catalog_filters');
                }
            }
            
            if (savedFilters) {
                const filters = JSON.parse(savedFilters);
                
                // Восстанавливаем значения полей
                if (filters.search && document.getElementById('searchInput')) {
                    document.getElementById('searchInput').value = filters.search;
                }
                if (filters.sku_search && document.getElementById('skuSearchInput')) {
                    document.getElementById('skuSearchInput').value = filters.sku_search;
                }
                if (filters.stock_filter && document.getElementById('stockFilter')) {
                    document.getElementById('stockFilter').value = filters.stock_filter;
                }
                if (filters.min_stock_filter && document.getElementById('minStockFilter')) {
                    document.getElementById('minStockFilter').value = filters.min_stock_filter;
                }
                if (filters.brand_filter && document.getElementById('brandFilter')) {
                    document.getElementById('brandFilter').value = filters.brand_filter;
                }
                if (filters.sort_order && document.getElementById('sortOrder')) {
                    document.getElementById('sortOrder').value = filters.sort_order;
                }
                if (filters.page_size && document.getElementById('pageSize')) {
                    document.getElementById('pageSize').value = filters.page_size;
                }
                
                // Обновляем currentFilters
                currentFilters = {
                    search: filters.search || '',
                    sku_search: filters.sku_search || '',
                    stock_filter: filters.stock_filter || null,
                    min_stock_filter: filters.min_stock_filter || null,
                    brand_filter: filters.brand_filter || '',
                    sort_order: filters.sort_order || '',
                    page_size: parseInt(filters.page_size) || 50
                };
                
                console.log(`Фильтры восстановлены из localStorage для пользователя ${userEmail}:`, filters);
                
                // Автоматически выполняем поиск после восстановления фильтров
                setTimeout(() => {
                    if (typeof handleFilterChange === 'function') {
                        console.log('Автоматически применяем восстановленные фильтры...');
                        handleFilterChange();
                    } else {
                        console.error('Функция handleFilterChange недоступна для автоматического поиска');
                    }
                }, 100); // Небольшая задержка для завершения инициализации
            }
        } catch (error) {
            console.error('Ошибка при восстановлении фильтров:', error);
        }
    }

    // Функции управления спиннером загрузки каталога
    function showCatalogSpinner(message = 'Загрузка каталога', submessage = 'Поиск товаров...') {
        const spinner = document.getElementById('catalogLoadingSpinner');
        console.log('showCatalogSpinner вызвана, спиннер найден:', !!spinner);
        const spinnerText = spinner?.querySelector('.catalog-spinner-text');
        const spinnerSubtext = spinner?.querySelector('.catalog-spinner-subtext');
        
        if (spinner) {
            if (spinnerText) spinnerText.textContent = message;
            if (spinnerSubtext) spinnerSubtext.textContent = submessage;
            spinner.style.display = 'flex';
            spinner.classList.remove('hidden');
            console.log('Спиннер каталога показан, display:', spinner.style.display);
        } else {
            console.error('Спиннер каталога не найден при показе!');
        }
    }

    function hideCatalogSpinner() {
        const spinner = document.getElementById('catalogLoadingSpinner');
        console.log('hideCatalogSpinner вызвана, спиннер найден:', !!spinner);
        if (spinner) {
            spinner.style.display = 'none';
            spinner.classList.add('hidden');
            console.log('Спиннер каталога скрыт, display:', spinner.style.display);
        } else {
            console.error('Спиннер каталога не найден!');
        }
    }

    function updateCatalogSpinnerMessage(message, submessage = null) {
        const spinner = document.getElementById('catalogLoadingSpinner');
        const spinnerText = spinner?.querySelector('.catalog-spinner-text');
        const spinnerSubtext = spinner?.querySelector('.catalog-spinner-subtext');
        
        if (spinnerText) spinnerText.textContent = message;
        if (submessage && spinnerSubtext) spinnerSubtext.textContent = submessage;
    }

    // Универсальная функция для переключения фильтров
    function toggleUniversalFilters() {
        // Всегда используем основные фильтры (они всплывают на всю страницу)
        toggleFilterSlider();
    }

    // Функция для переключения слайдера фильтров
    function toggleFilterSlider() {
        const slider = document.getElementById('filterSlider');
        const toggleBtn = document.getElementById('filterToggleBtn');

        if (slider.classList.contains('translate-y-full')) {
            // Открываем слайдер
            slider.classList.remove('translate-y-full');
            toggleBtn.classList.add('hidden');
        } else {
            // Закрываем слайдер
            slider.classList.add('translate-y-full');
            toggleBtn.classList.remove('hidden');
        }
    }

    // Функция для сброса фильтров
    function resetFilters() {
        document.getElementById('searchInput').value = '';
        document.getElementById('skuSearchInput').value = '';
        document.getElementById('minStockFilter').value = '';
        document.getElementById('stockFilter').value = '';
        document.getElementById('brandFilter').value = '';
        document.getElementById('sortOrder').value = '';
        document.getElementById('pageSize').value = '50';

        // Обновляем текущие фильтры
        currentFilters = {
            search: '',
            sku_search: '',
            stock_filter: null,
            min_stock_filter: null,
            brand_filter: '',
            sort_order: '',
            page_size: 50
        };

        // Очищаем сохраненные фильтры (персонально для пользователя)
        const userEmail = getUserEmail();
        const storageKey = `catalog_filters_${userEmail}`;
        localStorage.removeItem(storageKey);

        // Применяем сброшенные фильтры сразу
        handleFilterChange();
    }

    // Функция для применения фильтров
    function applyFilters() {
        handleFilterChange();
        toggleFilterSlider(); // Закрываем слайдер после применения
    }

    // Функция для обработки изменений фильтров
    async function handleFilterChange() {
        try {
            // Проверяем состояние воркспейса для правильного показа спиннера
            const workspaceContainer = document.getElementById('workspaceContainer');
            const isWorkspaceOpen = workspaceContainer && !workspaceContainer.classList.contains('hidden');
            
            console.log('handleFilterChange: workspaceContainer найден:', !!workspaceContainer);
            console.log('handleFilterChange: isWorkspaceOpen:', isWorkspaceOpen);
            console.log('handleFilterChange: showCatalogPanelSpinner доступна:', typeof showCatalogPanelSpinner === 'function');
            
            // Показываем правильный спиннер в зависимости от состояния воркспейса
            if (isWorkspaceOpen) {
                // Если воркспейс открыт, показываем спиннер правой панели
                if (typeof showCatalogPanelSpinner === 'function') {
                    console.log('handleFilterChange: показываем спиннер правой панели');
                    showCatalogPanelSpinner('Загрузка каталога', 'Применение фильтров...');
                } else {
                    console.error('handleFilterChange: функция showCatalogPanelSpinner недоступна!');
                }
            } else {
                // Если воркспейс закрыт, показываем основной спиннер каталога
                console.log('handleFilterChange: показываем основной спиннер каталога');
                showCatalogSpinner('Загрузка каталога', 'Применение фильтров...');
            }
            
            // Получаем значения фильтров
            const search = document.getElementById('searchInput').value.trim();
            const skuSearch = document.getElementById('skuSearchInput').value.trim();
            const pageSize = document.getElementById('pageSize').value;
            const stockFilterValue = document.getElementById('stockFilter').value.trim();
            const minStockFilterValue = document.getElementById('minStockFilter').value.trim();
            const brandFilter = document.getElementById('brandFilter').value;
            const sortOrder = document.getElementById('sortOrder').value;

            // Обновляем текущие фильтры
            currentFilters = {
                search,
                sku_search: skuSearch,
                page_size: parseInt(pageSize),
                stock_filter: stockFilterValue ? parseInt(stockFilterValue) : null,
                min_stock_filter: minStockFilterValue ? parseInt(minStockFilterValue) : null,
                brand_filter: brandFilter,
                sort_order: sortOrder
            };

            // Сохраняем фильтры в localStorage
            saveFiltersToStorage();

            // Обновляем URL параметры
            updateURLParams();

            // Формируем параметры запроса
            const params = new URLSearchParams();

            if (search) params.append('search', search);
            if (skuSearch) params.append('sku_search', skuSearch);
            if (pageSize) params.append('page_size', pageSize);
            params.append('page', '1');

            if (stockFilterValue !== '' && !isNaN(parseInt(stockFilterValue))) {
                params.append('stock_filter', parseInt(stockFilterValue).toString());
            }

            if (minStockFilterValue !== '' && !isNaN(parseInt(minStockFilterValue))) {
                params.append('min_stock_filter', parseInt(minStockFilterValue).toString());
            }

            if (brandFilter) params.append('brand_filter', brandFilter);
            if (sortOrder) params.append('sort_order', sortOrder);

            const queryString = params.toString();

            // Отправляем запрос
            const response = await fetch(`/catalog_new/api/products?${queryString}`, {
                method: 'GET',
                headers: {
                    'X-Requested-With': 'XMLHttpRequest',
                    'Accept': 'application/json'
                }
            });

            if (!response.ok) {
                throw new Error(`Ошибка при получении данных: ${response.status}`);
            }

            const data = await response.json();

            if (!data || !Array.isArray(data.products)) {
                throw new Error('Некорректный формат данных');
            }

            // Обновляем список товаров
            const productsList = document.getElementById('productsList');
            const catalogPanel = document.getElementById('catalogPanel');

            // Используем уже определенные переменные состояния воркспейса
            if (isWorkspaceOpen && catalogPanel) {
                // Обновляем только список товаров в правой панели
                const productsContainer = catalogPanel.querySelector('#productsList');
                if (productsContainer) {
                    productsContainer.innerHTML = data.products.map(item => item.html).join('');
                } else {
                    // Если контейнер не найден, создаем его
                    const productsDiv = document.createElement('div');
                    productsDiv.id = 'productsList';
                    productsDiv.className = 'grid grid-cols-1 gap-4 mb-8';
                    productsDiv.innerHTML = data.products.map(item => item.html).join('');
                    catalogPanel.appendChild(productsDiv);
                }

                // Переинициализируем обработчики для правой панели
                initializeCatalogHandlers();
                
                // Скрываем спиннер правой панели после обновления
                if (typeof hideCatalogPanelSpinner === 'function') {
                    hideCatalogPanelSpinner();
                }
            } else if (productsList) {
                // Если воркспейс закрыт, обновляем основной список
                productsList.innerHTML = data.products.map(item => item.html).join('');

                // Переинициализируем обработчики drag & drop для новых карточек
                initializeDragAndDrop();
            }

            // Обновляем пагинацию
            if (typeof data.page === 'number' && typeof data.total === 'number' && typeof data.page_size === 'number') {
                updatePagination(data.page, Math.ceil(data.total / data.page_size));
            }

            // Обновляем счетчик результатов
            const resultsCount = document.getElementById('resultsCount');
            if (resultsCount) {
                resultsCount.textContent = data.total || 0;
            }

            // Обновляем состояние пустого результата
            const emptyState = document.getElementById('emptyState');
            if (emptyState) {
                if (!data.products || data.products.length === 0) {
                    emptyState.classList.remove('hidden');
                    productsList?.classList.add('hidden');
                } else {
                    emptyState.classList.add('hidden');
                    productsList?.classList.remove('hidden');
                }
            }

            // Обновляем URL без перезагрузки страницы
            const newUrl = `/catalog_new?${queryString}`;
            window.history.pushState({}, '', newUrl);

            // Восстанавливаем выделение товаров в воркспейсе
            setTimeout(() => {
                if (typeof window.workspaceManager !== 'undefined' && window.workspaceManager) {
                    window.workspaceManager.highlightSelectedProducts();
                    console.log('Выделение товаров в воркспейсе восстановлено после фильтрации');
                }
            }, 100);

            // Скрываем правильный спиннер после успешной загрузки
            if (isWorkspaceOpen) {
                // Если воркспейс открыт, скрываем спиннер правой панели
                if (typeof hideCatalogPanelSpinner === 'function') {
                    hideCatalogPanelSpinner();
                }
            } else {
                // Если воркспейс закрыт, скрываем основной спиннер каталога
                hideCatalogSpinner();
            }

        } catch (error) {
            console.error('Ошибка при фильтрации:', error);
            showNotification('Произошла ошибка при фильтрации товаров: ' + error.message, 'error');
            
            // Скрываем правильный спиннер при ошибке
            if (isWorkspaceOpen) {
                // Если воркспейс открыт, скрываем спиннер правой панели
                if (typeof hideCatalogPanelSpinner === 'function') {
                    hideCatalogPanelSpinner();
                }
            } else {
                // Если воркспейс закрыт, скрываем основной спиннер каталога
                hideCatalogSpinner();
            }
        }
    }

    // Функция для обновления пагинации
    function updatePagination(currentPage, totalPages) {
        const nav = document.querySelector('[aria-label="Pagination"]');
        if (!nav) return;

        let html = '<ul class="inline-flex items-center -space-x-px rounded-md shadow-sm">';

        // Кнопка "Назад"
        if (currentPage > 1) {
            html += `
            <li>
                <a href="javascript:void(0)" onclick="goToPage(${currentPage - 1})"
                   class="relative inline-flex items-center rounded-l-md px-3 py-2 text-sm font-medium text-gray-900 ring-1 ring-inset ring-gray-300 hover:bg-gray-50 focus:z-20 focus:outline-offset-0">
                    <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" />
                    </svg>
                </a>
            </li>`;
        }

        // Номера страниц
        for (let i = 1; i <= totalPages; i++) {
            html += `
            <li>
                <a href="javascript:void(0)" onclick="goToPage(${i})"
                   class="relative inline-flex items-center px-4 py-2 text-sm font-medium ${i === currentPage
                    ? 'z-10 bg-blue-600 text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600'
                    : 'text-gray-900 ring-1 ring-inset ring-gray-300 hover:bg-gray-50 focus:z-20 focus:outline-offset-0'}">
                    ${i}
                </a>
            </li>`;
        }

        // Кнопка "Вперед"
        if (currentPage < totalPages) {
            html += `
            <li>
                <a href="javascript:void(0)" onclick="goToPage(${currentPage + 1})"
                   class="relative inline-flex items-center rounded-r-md px-3 py-2 text-sm font-medium text-gray-900 ring-1 ring-inset ring-gray-300 hover:bg-gray-50 focus:z-20 focus:outline-offset-0">
                    <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
                    </svg>
                </a>
            </li>`;
        }

        html += '</ul>';
        nav.innerHTML = html;
    }

    // Функция для перехода на страницу
    async function goToPage(page) {
        try {
            const params = new URLSearchParams();
            params.append('page', page);

            // Добавляем текущие фильтры
            if (currentFilters.search) params.append('search', currentFilters.search);
            if (currentFilters.page_size) params.append('page_size', currentFilters.page_size);
            if (currentFilters.stock_filter) params.append('stock_filter', currentFilters.stock_filter);
            if (currentFilters.min_stock_filter) params.append('min_stock_filter', currentFilters.min_stock_filter);
            if (currentFilters.brand_filter) params.append('brand_filter', currentFilters.brand_filter);
            if (currentFilters.sort_order) params.append('sort_order', currentFilters.sort_order);

            const response = await fetch(`/catalog_new/api/products?${params.toString()}`, {
                headers: {
                    'X-Requested-With': 'XMLHttpRequest',
                    'Accept': 'application/json'
                }
            });

            if (!response.ok) {
                throw new Error('Ошибка при получении данных');
            }

            const data = await response.json();

            if (!data || !Array.isArray(data.products)) {
                throw new Error('Некорректный формат данных');
            }

            // Обновляем список товаров
            const productsList = document.getElementById('productsList');
            const catalogPanel = document.getElementById('catalogPanel');

            // Проверяем, открыт ли воркспейс
            const workspaceContainer = document.getElementById('workspaceContainer');
            const isWorkspaceOpen = workspaceContainer && !workspaceContainer.classList.contains('hidden');

            if (isWorkspaceOpen && catalogPanel) {
                // Если воркспейс открыт, обновляем только список товаров в правой панели
                const productsContainer = catalogPanel.querySelector('#productsList');
                if (productsContainer) {
                    productsContainer.innerHTML = data.products.map(item => item.html).join('');
                } else {
                    // Если контейнер не найден, создаем его
                    const productsDiv = document.createElement('div');
                    productsDiv.id = 'productsList';
                    productsDiv.className = 'grid grid-cols-1 gap-4 mb-8';
                    productsDiv.innerHTML = data.products.map(item => item.html).join('');
                    catalogPanel.appendChild(productsDiv);
                }

                // Переинициализируем обработчики для правой панели
                initializeCatalogHandlers();
            } else if (productsList) {
                // Если воркспейс закрыт, обновляем основной список
                productsList.innerHTML = data.products.map(item => item.html).join('');

                // Переинициализируем обработчики drag & drop для новых карточек
                initializeDragAndDrop();
            }

            // Обновляем пагинацию
            if (typeof data.page === 'number' && typeof data.total === 'number' && typeof data.page_size === 'number') {
                updatePagination(data.page, Math.ceil(data.total / data.page_size));
            }

            // Обновляем счетчик результатов
            const resultsCount = document.getElementById('resultsCount');
            if (resultsCount) {
                resultsCount.textContent = data.total || 0;
            }

            // Обновляем URL
            const newUrl = `/catalog_new?${params.toString()}`;
            window.history.pushState({}, '', newUrl);

        } catch (error) {
            console.error('Ошибка при переходе на страницу:', error);
            showNotification('Произошла ошибка при загрузке страницы: ' + error.message, 'error');
        }
    }

    // Функция получения данных товаров из каталога
    function getCatalogProducts() {
        const products = [];
        const productCards = document.querySelectorAll('#productsList .product-card, #mainContent .product-card');
        
        productCards.forEach(card => {
            const productData = extractProductDataFromCard(card);
            if (productData && productData.sku) {
                products.push(productData);
            }
        });
        
        return products;
    }






    // Функция для извлечения данных товара из карточки
    function extractProductDataFromCard(card) {
        try {
            // Ищем SKU - более точный поиск
            let sku = null;
            
            // Пробуем разные способы поиска SKU
            const skuSelectors = [
                '.sku-text',
                '[data-sku]',
                '.text-sm.text-gray-600',
                'div:contains("SKU:")',
                'span:contains("SKU:")'
            ];
            
            for (const selector of skuSelectors) {
                const element = card.querySelector(selector);
                if (element) {
                    if (element.hasAttribute('data-sku')) {
                        sku = element.getAttribute('data-sku');
                    } else {
                        const text = element.textContent?.trim();
                        if (text && text.includes('SKU:')) {
                            sku = text.replace('SKU:', '').trim();
                        } else if (text && !text.includes('Бренд:') && !text.includes('EAN:') && text.length > 5) {
                            sku = text;
                        }
                    }
                    if (sku && sku !== 'x' && sku.length > 3) break;
                }
            }
            
            // Если SKU не найден или некорректный, пропускаем товар
            if (!sku || sku === 'x' || sku.length < 3) {
                console.warn('SKU не найден или некорректный в карточке товара:', sku);
                return null;
            }
            
            // Ищем название товара
            const nameElement = card.querySelector('.product-name') ||
                               card.querySelector('h3') ||
                               card.querySelector('.font-medium') ||
                               card.querySelector('.text-lg.font-medium');
            const name = nameElement?.textContent?.trim() || sku;
            
            // Ищем изображение
            const imgElement = card.querySelector('img');
            const imageUrl = imgElement?.src || imgElement?.getAttribute('data-src') || '';
            
            // Ищем бренд
            const brandElement = card.querySelector('.brand-text') ||
                               card.querySelector('.text-gray-500');
            let brand = 'Не указан';
            if (brandElement) {
                const brandText = brandElement.textContent?.trim();
                if (brandText && !brandText.includes('SKU:') && !brandText.includes('EAN:')) {
                    brand = brandText.replace('Бренд:', '').trim() || 'Не указан';
                }
            }
            
            // Ищем EAN
            const eanElement = card.querySelector('.ean-text') ||
                              card.querySelector('.text-xs.text-gray-400');
            let ean = '';
            if (eanElement) {
                const eanText = eanElement.textContent?.trim();
                if (eanText && eanText.includes('EAN:')) {
                    ean = eanText.replace('EAN:', '').trim();
                }
            }
            
            
            return {
                sku: sku,
                name: name,
                image: imageUrl,
                brand: brand,
                ean: ean,
                addedAt: new Date().toISOString()
            };
        } catch (error) {
            console.error('Ошибка при извлечении данных товара:', error);
            return null;
        }
    }

    // Функция для загрузки списка брендов
    async function loadBrands() {
        try {
            const response = await fetch('/catalog_new/api/brands');
            if (!response.ok) {
                throw new Error('Ошибка при загрузке брендов');
            }

            const data = await response.json();
            const brands = data.brands || [];

            const brandSelect = document.getElementById('brandFilter');
            if (brandSelect) {
                // Очищаем текущие опции (кроме "Все бренды")
                const defaultOption = brandSelect.querySelector('option[value=""]');
                brandSelect.innerHTML = '';
                if (defaultOption) {
                    brandSelect.appendChild(defaultOption);
                } else {
                    const option = document.createElement('option');
                    option.value = '';
                    option.textContent = 'Все бренды';
                    brandSelect.appendChild(option);
                }

                // Добавляем опцию "Без бренда"
                const noBrandOption = document.createElement('option');
                noBrandOption.value = '__no_brand__';
                noBrandOption.textContent = 'Без бренда';
                brandSelect.appendChild(noBrandOption);

                // Добавляем бренды
                brands.forEach(brand => {
                    const option = document.createElement('option');
                    option.value = brand;
                    option.textContent = brand;
                    brandSelect.appendChild(option);
                });

                // Устанавливаем выбранное значение если есть
                if (currentFilters.brand_filter) {
                    brandSelect.value = currentFilters.brand_filter;
                }
            }
        } catch (error) {
            console.error('Ошибка при загрузке брендов:', error);
        }
    }

    // Функция для показа уведомлений
    function showNotification(message, type = 'info') {
        const notification = document.createElement('div');
        notification.textContent = message;

        let bgColor = 'bg-blue-600';
        if (type === 'success') bgColor = 'bg-green-600';
        if (type === 'error') bgColor = 'bg-red-600';
        if (type === 'warning') bgColor = 'bg-yellow-600';

        notification.className = `fixed bottom-4 left-4 ${bgColor} text-white px-3 py-2 rounded-md shadow-md z-50 transition-all duration-300 transform translate-y-full opacity-0 text-sm`;
        notification.style.maxWidth = '250px';
        notification.style.fontSize = '14px';

        document.body.appendChild(notification);

        // Анимация появления
        requestAnimationFrame(() => {
            notification.style.transform = 'translateY(0)';
            notification.style.opacity = '1';
        });

        setTimeout(() => {
            notification.style.transform = 'translateY(100%)';
            notification.style.opacity = '0';
            setTimeout(() => {
                if (notification.parentNode) {
                    notification.parentNode.removeChild(notification);
                }
            }, 300);
        }, 5000);
    }

    // Универсальная функция для обновления карточек товаров
    async function refreshProductCards(sku) {
        try {
            // Защита от множественных одновременных вызовов
            if (!window.refreshInProgress) window.refreshInProgress = {};
            if (window.refreshInProgress[sku]) {
                return;
            }
            window.refreshInProgress[sku] = true;
            
            // Проверяем, есть ли карточки на странице
            const mainCards = document.querySelectorAll(`#mainContent [data-product-sku="${sku}"]`);
            const workspaceCards = document.querySelectorAll(`#workspaceProductsList [data-product-sku="${sku}"]`);
            const catalogPanelCards = document.querySelectorAll(`#catalogPanel [data-product-sku="${sku}"]`);
            
            if (mainCards.length > 0) {
                await refreshCatalogCard(sku);
            }
            
            // Обновляем карточку в воркспейсе, если товар там есть
            if (typeof workspaceManager !== 'undefined' && workspaceManager && workspaceManager.selectedProducts[sku]) {
                await refreshWorkspaceCard(sku);
            }
            
            // Переинициализируем drag-and-drop для новых элементов
            if (typeof window.reinitializeDragAndDrop === 'function') {
                setTimeout(() => {
                    window.reinitializeDragAndDrop();
                }, 100);
            }
        } catch (error) {
            console.error('❌ Ошибка при обновлении карточек товара:', error);
            if (typeof showNotification === 'function') {
                showNotification('Ошибка при обновлении данных товара', 'error');
            }
        } finally {
            // Очищаем флаг выполнения
            if (window.refreshInProgress && window.refreshInProgress[sku]) {
                delete window.refreshInProgress[sku];
            }
        }
    }

    // Инициализация при загрузке страницы
    document.addEventListener('DOMContentLoaded', function() {
        // Восстанавливаем фильтры из localStorage
        restoreFiltersFromStorage();
        
        // Обновляем URL параметры
        updateURLParams();
        
        // Добавляем обработчики событий для фильтров
        const filterInputs = [
            'searchInput',
            'skuSearchInput', 
            'stockFilter',
            'minStockFilter',
            'brandFilter',
            'sortOrder',
            'pageSize'
        ];
        
        filterInputs.forEach(inputId => {
            const input = document.getElementById(inputId);
            if (input) {
                // Для полей ввода (поиск, SKU, остатки) - только сохраняем в localStorage
                if (inputId === 'searchInput' || inputId === 'skuSearchInput' || 
                    inputId === 'stockFilter' || inputId === 'minStockFilter') {
                    input.addEventListener('input', function() {
                        clearTimeout(searchTimeout);
                        searchTimeout = setTimeout(() => {
                            saveFiltersToStorage();
                            updateURLParams();
                            // НЕ применяем фильтры автоматически - только сохраняем
                        }, 500); // Задержка 500мс для текстовых полей
                    });
                } 
                // Для сортировки и фильтра бренда - применяем сразу
                else if (inputId === 'sortOrder' || inputId === 'brandFilter') {
                    input.addEventListener('change', function() {
                        saveFiltersToStorage();
                        updateURLParams();
                        // Автоматически применяем фильтры при изменении
                        handleFilterChange();
                    });
                }
                // Для размера страницы - только сохраняем
                else if (inputId === 'pageSize') {
                    input.addEventListener('change', function() {
                        saveFiltersToStorage();
                        updateURLParams();
                        // НЕ применяем фильтры автоматически - только сохраняем
                    });
                }
            }
        });
        
        console.log('Фильтры инициализированы при загрузке страницы');
    });

// Функция обновления каталога после добавления товара
window.refreshCatalog = function() {
    // Просто перезагружаем страницу для обновления каталога
    window.location.reload();
};
</script>
