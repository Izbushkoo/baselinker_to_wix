    // Функция для переключения слайдера фильтров
    function toggleFilterSlider() {
        const slider = document.getElementById('filterSlider');
        const toggleBtn = document.getElementById('filterToggleBtn');

        if (slider.classList.contains('translate-y-full')) {
            // Открываем слайдер
            slider.classList.remove('translate-y-full');
            toggleBtn.classList.add('hidden');
        } else {
            // Закрываем слайдер

        }
    }

    // Функция для обработки изменений фильтров
    async function handleFilterChange() {
        try {
            // Получаем значения фильтров
            const search = document.getElementById('searchInput').value.trim();
            const pageSize = document.getElementById('pageSize').value;
            const stockFilterValue = document.getElementById('stockFilter').value.trim();
            const minStockFilterValue = document.getElementById('minStockFilter').value.trim();
            const brandFilter = document.getElementById('brandFilter').value;
            const sortOrder = document.getElementById('sortOrder').value;

            // Обновляем текущие фильтры
            currentFilters = {
                search,
                page_size: parseInt(pageSize),
                stock_filter: stockFilterValue ? parseInt(stockFilterValue) : null,
                min_stock_filter: minStockFilterValue ? parseInt(minStockFilterValue) : null,
                brand_filter: brandFilter,
                sort_order: sortOrder
            };

            // Формируем параметры запроса
            const params = new URLSearchParams();

            if (search) params.append('search', search);
            if (pageSize) params.append('page_size', pageSize);
            params.append('page', '1');

            if (stockFilterValue !== '' && !isNaN(parseInt(stockFilterValue))) {
                params.append('stock_filter', parseInt(stockFilterValue).toString());
            }

            if (minStockFilterValue !== '' && !isNaN(parseInt(minStockFilterValue))) {
                params.append('min_stock_filter', parseInt(minStockFilterValue).toString());
            }

            if (brandFilter) params.append('brand_filter', brandFilter);
            if (sortOrder) params.append('sort_order', sortOrder);

            const queryString = params.toString();
            console.log('Сформированный URL:', `/catalog_new/api/products?${queryString}`);

            // Отправляем запрос
            const response = await fetch(`/catalog_new/api/products?${queryString}`, {
                method: 'GET',
                headers: {
                    'X-Requested-With': 'XMLHttpRequest',
                    'Accept': 'application/json'
                }
            });

            if (!response.ok) {
                throw new Error(`Ошибка при получении данных: ${response.status}`);
            }

            const data = await response.json();

            if (!data || !Array.isArray(data.products)) {
                throw new Error('Некорректный формат данных');
            }

            // Обновляем список товаров
            const productsList = document.getElementById('productsList');
            const catalogPanel = document.getElementById('catalogPanel');

            // Проверяем, открыт ли воркспейс
            const workspaceContainer = document.getElementById('workspaceContainer');
            const isWorkspaceOpen = workspaceContainer && !workspaceContainer.classList.contains('hidden');

            if (isWorkspaceOpen && catalogPanel) {
                // Если воркспейс открыт, обновляем только список товаров в правой панели
                const productsContainer = catalogPanel.querySelector('#productsList');
                if (productsContainer) {
                    productsContainer.innerHTML = data.products.map(item => item.html).join('');
                } else {
                    // Если контейнер не найден, создаем его
                    const productsDiv = document.createElement('div');
                    productsDiv.id = 'productsList';
                    productsDiv.className = 'grid grid-cols-1 gap-4 mb-8';
                    productsDiv.innerHTML = data.products.map(item => item.html).join('');
                    catalogPanel.appendChild(productsDiv);
                }

                // Переинициализируем обработчики для правой панели
                initializeCatalogHandlers();
            } else if (productsList) {
                // Если воркспейс закрыт, обновляем основной список
                productsList.innerHTML = data.products.map(item => item.html).join('');

                // Переинициализируем обработчики drag & drop для новых карточек
                initializeDragAndDrop();
            }

            // Обновляем пагинацию
            if (typeof data.page === 'number' && typeof data.total === 'number' && typeof data.page_size === 'number') {
                updatePagination(data.page, Math.ceil(data.total / data.page_size));
            }

            // Обновляем счетчик результатов
            const resultsCount = document.getElementById('resultsCount');
            if (resultsCount) {
                resultsCount.textContent = data.total || 0;
            }

            // Обновляем состояние пустого результата
            const emptyState = document.getElementById('emptyState');
            if (emptyState) {
                if (!data.products || data.products.length === 0) {
                    emptyState.classList.remove('hidden');
                    productsList?.classList.add('hidden');
                } else {
                    emptyState.classList.add('hidden');
                    productsList?.classList.remove('hidden');
                }
            }

            // Обновляем URL без перезагрузки страницы
            const newUrl = `/catalog_new?${queryString}`;
            window.history.pushState({}, '', newUrl);

        } catch (error) {
            console.error('Ошибка при фильтрации:', error);
            showNotification('Произошла ошибка при фильтрации товаров: ' + error.message, 'error');
        }
    }

    // Функция для обновления пагинации
    function updatePagination(currentPage, totalPages) {
        const nav = document.querySelector('[aria-label="Pagination"]');
        if (!nav) return;

        let html = '<ul class="inline-flex items-center -space-x-px rounded-md shadow-sm">';

        // Кнопка "Назад"
        if (currentPage > 1) {
            html += `
            <li>
                <a href="javascript:void(0)" onclick="goToPage(${currentPage - 1})"
                   class="relative inline-flex items-center rounded-l-md px-3 py-2 text-sm font-medium text-gray-900 ring-1 ring-inset ring-gray-300 hover:bg-gray-50 focus:z-20 focus:outline-offset-0">
                    <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" />
                    </svg>
                </a>
            </li>`;
        }

        // Номера страниц
        for (let i = 1; i <= totalPages; i++) {
            html += `
            <li>
                <a href="javascript:void(0)" onclick="goToPage(${i})"
                   class="relative inline-flex items-center px-4 py-2 text-sm font-medium ${i === currentPage
                    ? 'z-10 bg-blue-600 text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600'
                    : 'text-gray-900 ring-1 ring-inset ring-gray-300 hover:bg-gray-50 focus:z-20 focus:outline-offset-0'}">
                    ${i}
                </a>
            </li>`;
        }

        // Кнопка "Вперед"
        if (currentPage < totalPages) {
            html += `
            <li>
                <a href="javascript:void(0)" onclick="goToPage(${currentPage + 1})"
                   class="relative inline-flex items-center rounded-r-md px-3 py-2 text-sm font-medium text-gray-900 ring-1 ring-inset ring-gray-300 hover:bg-gray-50 focus:z-20 focus:outline-offset-0">
                    <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
                    </svg>
                </a>
            </li>`;
        }

        html += '</ul>';
        nav.innerHTML = html;
    }

    // Функция получения данных товаров из каталога
    function getCatalogProducts() {
        const products = [];
        const productCards = document.querySelectorAll('#productsList .product-card, #mainContent .product-card');
        
        productCards.forEach(card => {
            const productData = extractProductDataFromCard(card);
            if (productData && productData.sku) {
                products.push(productData);
            }
        });
        
        return products;
    }






    // Функция для извлечения данных товара из карточки
    function extractProductDataFromCard(card) {
        try {
            // Ищем SKU - более точный поиск
            let sku = null;
            
            // Пробуем разные способы поиска SKU
            const skuSelectors = [
                '.sku-text',
                '[data-sku]',
                '.text-sm.text-gray-600',
                'div:contains("SKU:")',
                'span:contains("SKU:")'
            ];
            
            for (const selector of skuSelectors) {
                const element = card.querySelector(selector);
                if (element) {
                    if (element.hasAttribute('data-sku')) {
                        sku = element.getAttribute('data-sku');
                    } else {
                        const text = element.textContent?.trim();
                        if (text && text.includes('SKU:')) {
                            sku = text.replace('SKU:', '').trim();
                        } else if (text && !text.includes('Бренд:') && !text.includes('EAN:') && text.length > 5) {
                            sku = text;
                        }
                    }
                    if (sku && sku !== 'x' && sku.length > 3) break;
                }
            }
            
            // Если SKU не найден или некорректный, пропускаем товар
            if (!sku || sku === 'x' || sku.length < 3) {
                console.warn('SKU не найден или некорректный в карточке товара:', sku);
                return null;
            }
            
            // Ищем название товара
            const nameElement = card.querySelector('.product-name') ||
                               card.querySelector('h3') ||
                               card.querySelector('.font-medium') ||
                               card.querySelector('.text-lg.font-medium');
            const name = nameElement?.textContent?.trim() || sku;
            
            // Ищем изображение
            const imgElement = card.querySelector('img');
            const imageUrl = imgElement?.src || imgElement?.getAttribute('data-src') || '';
            
            // Ищем бренд
            const brandElement = card.querySelector('.brand-text') ||
                               card.querySelector('.text-gray-500');
            let brand = 'Не указан';
            if (brandElement) {
                const brandText = brandElement.textContent?.trim();
                if (brandText && !brandText.includes('SKU:') && !brandText.includes('EAN:')) {
                    brand = brandText.replace('Бренд:', '').trim() || 'Не указан';
                }
            }
            
            // Ищем EAN
            const eanElement = card.querySelector('.ean-text') ||
                              card.querySelector('.text-xs.text-gray-400');
            let ean = '';
            if (eanElement) {
                const eanText = eanElement.textContent?.trim();
                if (eanText && eanText.includes('EAN:')) {
                    ean = eanText.replace('EAN:', '').trim();
                }
            }
            
            
            return {
                sku: sku,
                name: name,
                image: imageUrl,
                brand: brand,
                ean: ean,
                addedAt: new Date().toISOString()
            };
        } catch (error) {
            console.error('Ошибка при извлечении данных товара:', error);
            return null;
        }
    }

    async function forceSyncAllStocks() {
        const button = document.getElementById('forceSyncBtn');
        const originalText = button.innerHTML;
        
        // Подтверждение действия
        const confirmed = confirm(
            'ВНИМАНИЕ! Принудительная синхронизация остатков:\n\n' +
            '• Игнорирует флаги включения синхронизации остатков\n' +
            '• Синхронизирует ВСЕ товары для всех аккаунтов\n' +
            '• Может быть ресурсоемкой операцией\n' +
            '• Предназначена для исключительных случаев\n\n' +
            'Продолжить?'
        );
        
        if (!confirmed) {
            return;
        }
        
        // Блокируем кнопку и показываем индикатор загрузки
        button.disabled = true;
        button.innerHTML = `
            <svg class="w-5 h-5 mr-2 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
            </svg>
            <span>Запуск синхронизации...</span>
        `;
        
        try {
            const response = await fetch('/api/products/sync-all-accounts/stocks/force', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                }
            });
            
            const data = await response.json();
            
            if (data.success) {
                showNotification(
                    `Принудительная синхронизация запущена! Task ID: ${data.task_id}`, 
                    'success'
                );
            } else {
                showNotification(
                    data.message || 'Ошибка при запуске принудительной синхронизации', 
                    'error'
                );
            }
            
        } catch (error) {
            console.error('Ошибка при запуске принудительной синхронизации:', error);
            showNotification(
                'Ошибка при запуске принудительной синхронизации: ' + error.message, 
                'error'
            );
        } finally {
            // Восстанавливаем кнопку
            button.disabled = false;
            button.innerHTML = originalText;
        }
    }

    // Функция для загрузки списка брендов
    async function loadBrands() {
        try {
            const response = await fetch('/catalog_new/api/brands');
            if (!response.ok) {
                throw new Error('Ошибка при загрузке брендов');
            }

            const data = await response.json();
            const brands = data.brands || [];

            const brandSelect = document.getElementById('brandFilter');
            if (brandSelect) {
                // Очищаем текущие опции (кроме "Все бренды")
                const defaultOption = brandSelect.querySelector('option[value=""]');
                brandSelect.innerHTML = '';
                if (defaultOption) {
                    brandSelect.appendChild(defaultOption);
                } else {
                    const option = document.createElement('option');
                    option.value = '';
                    option.textContent = 'Все бренды';
                    brandSelect.appendChild(option);
                }

                // Добавляем бренды
                brands.forEach(brand => {
                    const option = document.createElement('option');
                    option.value = brand;
                    option.textContent = brand;
                    brandSelect.appendChild(option);
                });

                // Устанавливаем выбранное значение если есть
                if (currentFilters.brand_filter) {
                    brandSelect.value = currentFilters.brand_filter;
                }
            }
        } catch (error) {
            console.error('Ошибка при загрузке брендов:', error);
        }
    }

        // Закрытие слайдера по нажатию Escape
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                const slider = document.getElementById('filterSlider');
                const toggleBtn = document.getElementById('filterToggleBtn');

                if (!slider.classList.contains('translate-y-full')) {
                    slider.classList.add('translate-y-full');
                    toggleBtn.classList.remove('hidden');
                }
            }
        });
    });

    // Функция для показа уведомлений
    function showNotification(message, type = 'info') {
        const notification = document.createElement('div');
        notification.textContent = message;

        let bgColor = 'bg-blue-600';
        if (type === 'success') bgColor = 'bg-green-600';
        if (type === 'error') bgColor = 'bg-red-600';
        if (type === 'warning') bgColor = 'bg-yellow-600';

        notification.className = `fixed bottom-4 left-4 ${bgColor} text-white px-3 py-2 rounded-md shadow-md z-50 transition-all duration-300 transform translate-y-full opacity-0 text-sm`;
        notification.style.maxWidth = '250px';
        notification.style.fontSize = '14px';

        document.body.appendChild(notification);

        // Анимация появления
        requestAnimationFrame(() => {
            notification.style.transform = 'translateY(0)';
            notification.style.opacity = '1';
        });

        setTimeout(() => {
            notification.style.transform = 'translateY(100%)';
            notification.style.opacity = '0';
            setTimeout(() => {
                if (notification.parentNode) {
                    notification.parentNode.removeChild(notification);
                }
            }, 300);
        }, 5000);
    }

    // Заглушки для недостающих функций

    // Универсальная функция для обновления карточек товаров
    async function refreshProductCards(sku) {
        try {
            // Счетчик вызовов для отладки
            if (!window.refreshCallCount) window.refreshCallCount = {};
            if (!window.refreshCallCount[sku]) window.refreshCallCount[sku] = 0;
            window.refreshCallCount[sku]++;
            
            // Защита от множественных одновременных вызовов
            if (!window.refreshInProgress) window.refreshInProgress = {};
            if (window.refreshInProgress[sku]) {
                console.log('⚠️ Обновление для SKU', sku, 'уже выполняется, пропускаем дублирующий вызов');
                return;
            }
            window.refreshInProgress[sku] = true;
            
            console.log('🚀 НОВАЯ ВЕРСИЯ refreshProductCards вызвана для SKU:', sku, `(вызов #${window.refreshCallCount[sku]})`);
            console.log('🔄 Обновление карточек товара:', sku);
            console.log('🔍 Проверяем наличие карточек на странице...');
            
            // Проверяем, есть ли карточки на странице
            const mainCards = document.querySelectorAll(`#mainContent [data-product-sku="${sku}"]`);
            const workspaceCards = document.querySelectorAll(`#workspaceProductsList [data-product-sku="${sku}"]`);
            const catalogPanelCards = document.querySelectorAll(`#catalogPanel [data-product-sku="${sku}"]`);
            
            console.log(`📊 Найдено карточек: основной каталог=${mainCards.length}, воркспейс=${workspaceCards.length}, панель каталога=${catalogPanelCards.length}`);
            
            // Проверяем, есть ли контейнер #mainContent
            const mainContent = document.querySelector('#mainContent');
            console.log('🏠 Контейнер #mainContent найден:', !!mainContent);
            
            if (mainCards.length > 0) {
                console.log('📋 Найдены карточки в каталоге, обновляем...');
                await refreshCatalogCard(sku);
            } else {
                console.log('⚠️ Карточки в каталоге не найдены, пропускаем обновление каталога');
            }
            
            // Обновляем карточку в воркспейсе, если товар там есть
            if (typeof workspaceManager !== 'undefined' && workspaceManager && workspaceManager.selectedProducts[sku]) {
                console.log('💼 Обновляем карточку в воркспейсе...');
                await refreshWorkspaceCard(sku);
            } else {
                console.log('💼 Товар не найден в воркспейсе, пропускаем обновление воркспейса');
            }
            
            // Выделение восстанавливается локально в каждой функции обновления карточек
            
            // Переинициализируем drag-and-drop для новых элементов
            if (typeof window.reinitializeDragAndDrop === 'function') {
                console.log('🔄 Переинициализируем drag-and-drop после обновления карточек');
                setTimeout(() => {
                    window.reinitializeDragAndDrop();
                }, 100);
            }
            
            console.log('✅ Карточки товара успешно обновлены');
        } catch (error) {
            console.error('❌ Ошибка при обновлении карточек товара:', error);
            if (typeof showNotification === 'function') {
                showNotification('Ошибка при обновлении данных товара', 'error');
            }
        } finally {
            // Очищаем флаг выполнения
            if (window.refreshInProgress && window.refreshInProgress[sku]) {
                delete window.refreshInProgress[sku];
                console.log('🧹 Очищен флаг выполнения для SKU:', sku);
            }
        }
    }
    
    // Обновление карточки в каталоге
    async function refreshCatalogCard(sku) {
        try {
            console.log('🚀 НОВАЯ ВЕРСИЯ refreshCatalogCard вызвана для SKU:', sku);
            console.log('🌐 Запрашиваем обновленную карточку для SKU:', sku);
            
            // Сохраняем состояние выделения перед обновлением
            console.log(`🔍 Ищем карточки для SKU: ${sku}`);
            
            // Ищем все возможные карточки
            const allCardsWithSku = document.querySelectorAll(`[data-product-sku="${sku}"]`);
            console.log(`📋 Всего найдено элементов с SKU ${sku}:`, allCardsWithSku.length);
            
            allCardsWithSku.forEach((element, index) => {
                const productCard = element.closest('.product-card');
                console.log(`📋 Элемент ${index + 1}:`, {
                    element: element.tagName,
                    hasProductCard: !!productCard,
                    isSelected: productCard?.classList.contains('workspace-selected') || false,
                    parentId: productCard?.closest('[id]')?.id || 'no-id'
                });
            });
            
            const mainCard = document.querySelector(`#mainContent [data-product-sku="${sku}"]`)?.closest('.product-card');
            const catalogCard = document.querySelector(`#catalogPanel [data-product-sku="${sku}"]`)?.closest('.product-card');
            
            const wasMainCardSelected = mainCard?.classList.contains('workspace-selected') || false;
            const wasCatalogCardSelected = catalogCard?.classList.contains('workspace-selected') || false;
            
            console.log('💾 Сохраняем состояние выделения:', { 
                mainCard: wasMainCardSelected, 
                catalogCard: wasCatalogCardSelected,
                mainCardFound: !!mainCard,
                catalogCardFound: !!catalogCard
            });
            
            const url = `/catalog_new/api/products/${sku}/card?context=catalog`;
            console.log('📡 URL запроса:', url);
            
            const response = await fetch(url, {
                method: 'GET',
                headers: {
                    'Accept': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest'
                }
            });
            
            console.log('📡 Статус ответа:', response.status, response.statusText);
            
            if (!response.ok) {
                throw new Error(`Ошибка при получении обновленных данных товара: ${response.status} ${response.statusText}`);
            }
            
            const data = await response.json();
            console.log('📦 Получены данные карточки:', data);
            
            // Обновляем карточку в основном каталоге
            console.log('🔍 Ищем карточку в основном каталоге...');
            console.log('🎯 Найденная карточка в каталоге:', !!mainCard);
            if (mainCard) {
                console.log('🔄 Обновляем карточку в основном каталоге');
                
                console.log('🔍 Отладка обновления карточки:');
                console.log('  - data.html длина:', data.html.length);
                console.log('  - data.html начало:', data.html.substring(0, 200) + '...');
                console.log('  - mainCard до обновления:', mainCard.outerHTML.substring(0, 200) + '...');
                
                // Создаем временный элемент для извлечения содержимого
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = data.html;
                const newCardContent = tempDiv.querySelector('.product-card');
                
                if (newCardContent) {
                    // Получаем только внутреннее содержимое карточки (без внешнего div.product-card)
                    const innerContent = newCardContent.innerHTML;
                    console.log('  - Используем innerHTML из найденной карточки (без внешнего div)');
                    mainCard.innerHTML = innerContent;
                } else {
                    // Если не удалось найти карточку, используем весь HTML
                    console.log('  - Используем весь data.html (fallback)');
                    mainCard.innerHTML = data.html;
                }
                
                console.log('  - mainCard после обновления:', mainCard.outerHTML.substring(0, 200) + '...');
                
                console.log('✅ Карточка в каталоге обновлена');
                
                // Восстанавливаем выделение если оно было
                if (wasMainCardSelected) {
                    const newMainCard = document.querySelector(`#mainContent [data-product-sku="${sku}"]`)?.closest('.product-card');
                    if (newMainCard) {
                        console.log('🎨 Восстанавливаем выделение для карточки в основном каталоге');
                        newMainCard.classList.add('workspace-selected');
                        console.log('✅ Класс добавлен, проверяем:', newMainCard.classList.contains('workspace-selected'));
                    } else {
                        console.log('❌ Не удалось найти обновленную карточку в основном каталоге');
                    }
                }
            } else {
                console.log('⚠️ Карточка в основном каталоге не найдена');
            }
            
            // Обновляем карточку в правой панели воркспейса (если воркспейс открыт)
            if (catalogCard) {
                console.log('🔄 Обновляем карточку в правой панели воркспейса');
                
                // Создаем временный элемент для извлечения содержимого
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = data.html;
                const newCardContent = tempDiv.querySelector('.product-card');
                
                if (newCardContent) {
                    // Получаем только внутреннее содержимое карточки (без внешнего div.product-card)
                    const innerContent = newCardContent.innerHTML;
                    console.log('  - Используем innerHTML из найденной карточки (без внешнего div) для правой панели');
                    catalogCard.innerHTML = innerContent;
                } else {
                    // Если не удалось найти карточку, используем весь HTML
                    console.log('  - Используем весь data.html (fallback) для правой панели');
                    catalogCard.innerHTML = data.html;
                }
                
                console.log('✅ Карточка в правой панели воркспейса обновлена');
                
                // Восстанавливаем выделение если оно было
                if (wasCatalogCardSelected) {
                    const newCatalogCard = document.querySelector(`#catalogPanel [data-product-sku="${sku}"]`)?.closest('.product-card');
                    if (newCatalogCard) {
                        console.log('🎨 Восстанавливаем выделение для карточки в правой панели');
                        newCatalogCard.classList.add('workspace-selected');
                        console.log('✅ Класс добавлен в правой панели, проверяем:', newCatalogCard.classList.contains('workspace-selected'));
                    } else {
                        console.log('❌ Не удалось найти обновленную карточку в правой панели');
                    }
                }
            } else {
                console.log('⚠️ Карточка в правой панели воркспейса не найдена');
            }
            
            // Переинициализируем drag-and-drop для обновленных элементов
            if (typeof window.reinitializeDragAndDrop === 'function') {
                console.log('🔄 Переинициализируем drag-and-drop после обновления карточки каталога');
                setTimeout(() => {
                    window.reinitializeDragAndDrop();
                }, 100);
            }
            
            // Переинициализируем обработчики полей ввода после обновления карточек
            // Обработчики полей ввода работают через делегирование событий
            
        } catch (error) {
            console.error('❌ Ошибка при обновлении карточки каталога:', error);
        }
    }
    
    // Обновление карточки в воркспейсе
    async function refreshWorkspaceCard(sku) {
        try {
            console.log('💼 Запрашиваем обновленную карточку воркспейса для SKU:', sku);
            
            // Сохраняем состояние выделения перед обновлением
            const workspaceCard = document.querySelector(`#workspaceProductsList [data-product-sku="${sku}"]`)?.closest('.product-card');
            const wasWorkspaceCardSelected = workspaceCard?.classList.contains('workspace-selected') || false;
            
            console.log('💾 Сохраняем состояние выделения воркспейса:', wasWorkspaceCardSelected);
            
            const response = await fetch('/catalog_new/api/cards', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({
                    skus: [sku],
                    context: 'workspace'
                })
            });
            
            console.log('📡 Статус ответа воркспейса:', response.status, response.statusText);
            
            if (!response.ok) {
                throw new Error(`Ошибка при получении обновленной карточки воркспейса: ${response.status} ${response.statusText}`);
            }
            
            const data = await response.json();
            console.log('📦 Получены данные карточки воркспейса:', data);
            
            // Обновляем карточку в воркспейсе
            if (workspaceCard && data.html) {
                console.log('🔄 Обновляем карточку в воркспейсе');
                workspaceCard.outerHTML = data.html;
                console.log('✅ Карточка в воркспейсе обновлена');
                
                // Восстанавливаем выделение если оно было
                if (wasWorkspaceCardSelected) {
                    const newWorkspaceCard = document.querySelector(`#workspaceProductsList [data-product-sku="${sku}"]`)?.closest('.product-card');
                    if (newWorkspaceCard) {
                        console.log('🎨 Восстанавливаем выделение для карточки в воркспейсе');
                        newWorkspaceCard.classList.add('workspace-selected');
                    }
                }
            } else {
                console.log('⚠️ Карточка в воркспейсе не найдена или нет HTML данных');
            }
            
            // Переинициализируем drag-and-drop для обновленных элементов
            if (typeof window.reinitializeDragAndDrop === 'function') {
                console.log('🔄 Переинициализируем drag-and-drop после обновления карточки воркспейса');
                setTimeout(() => {
                    window.reinitializeDragAndDrop();
                }, 100);
            }
            
            // Обработчики полей ввода работают через делегирование событий
            
        } catch (error) {
            console.error('❌ Ошибка при обновлении карточки воркспейса:', error);
        }
    }
    
    // Делаем функцию глобально доступной
    window.refreshProductCards = refreshProductCards;
</script>
