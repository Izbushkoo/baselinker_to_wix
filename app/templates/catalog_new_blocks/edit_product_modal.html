<!--
 * @file: edit_product_modal.html
 * @description: Модальное окно для редактирования товара
 * @dependencies: catalog_new_blocks/scripts.html
 * @created: 2025-01-19
-->

<!-- Модальное окно редактирования товара -->
<div id="editProductModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden">
    <div class="flex items-center justify-center min-h-screen p-4" onclick="closeEditProductModal()">
        <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto" onclick="event.stopPropagation()">
            <!-- Заголовок модального окна -->
            <div class="flex items-center justify-between p-6 border-b border-gray-200">
                <h2 class="text-xl font-semibold text-gray-900">Редактировать товар</h2>
                <button onclick="closeEditProductModal()" class="text-gray-400 hover:text-gray-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- Форма редактирования -->
            <form id="editProductModalForm" class="p-6 space-y-6">
                <!-- Основная информация -->
                <div class="space-y-4">
                    <div>
                        <label for="editProductName" class="block text-sm font-medium text-gray-700">Название товара</label>
                        <input type="text" 
                               name="name" 
                               id="editProductName" 
                               required 
                               class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
                    </div>

                    <div>
                        <label for="editProductNameEng" class="block text-sm font-medium text-gray-700">Название товара (англ.)</label>
                        <input type="text" 
                               name="name_eng" 
                               id="editProductNameEng" 
                               placeholder="Введите английское название товара (необязательно)"
                               class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
                    </div>

                    <div>
                        <label for="editProductBrand" class="block text-sm font-medium text-gray-700">Бренд</label>
                        <input type="text" 
                               name="brand" 
                               id="editProductBrand" 
                               placeholder="Введите название бренда (необязательно)"
                               class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
                    </div>

                    <div>
                        <label for="editProductSku" class="block text-sm font-medium text-gray-700">SKU</label>
                        <input type="text" 
                               name="new_sku" 
                               id="editProductSku" 
                               required 
                               placeholder="Введите уникальный идентификатор товара"
                               class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
                    </div>

                    <div>
                        <label for="editProductEan" class="block text-sm font-medium text-gray-700">EAN (штрихкод)</label>
                        <input type="text" 
                               name="ean" 
                               id="editProductEan" 
                               placeholder="Введите один или несколько штрихкодов через запятую"
                               class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
                    </div>
                </div>

                <!-- Изображение -->
                <div>
                    <label for="editProductImage" class="block text-sm font-medium text-gray-700">Изображение товара</label>
                    <div class="mt-1 flex items-center">
                        <div id="editProductImagePreview" class="mr-4 w-20 h-20 rounded-lg bg-gray-100 flex items-center justify-center">
                            <svg class="w-8 h-8 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                            </svg>
                        </div>
                        <label class="relative cursor-pointer bg-white rounded-md font-medium text-blue-600 hover:text-blue-500 focus-within:outline-none focus-within:ring-2 focus-within:ring-offset-2 focus-within:ring-blue-500">
                            <span class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">
                                <svg class="w-5 h-5 mr-2 -ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                </svg>
                                Заменить изображение
                            </span>
                            <input type="file" 
                                   name="image" 
                                   id="editProductImage" 
                                   accept="image/*"
                                   class="sr-only">
                        </label>
                    </div>
                    <p class="mt-2 text-sm text-gray-500">PNG, JPG или GIF до 5MB. Оставьте пустым, чтобы сохранить текущее изображение.</p>
                </div>

                <!-- Кнопки -->
                <div class="flex justify-end space-x-3 pt-4 border-t border-gray-200">
                    <button type="button" 
                            onclick="closeEditProductModal()"
                            class="inline-flex justify-center rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2">
                        Отмена
                    </button>
                    <button type="submit" 
                            id="editProductSubmitBtn"
                            class="inline-flex justify-center rounded-md border border-transparent bg-blue-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                        <span id="editProductSubmitText">Сохранить изменения</span>
                        <svg id="editProductSubmitSpinner" class="hidden animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
// Переменные для хранения данных редактируемого товара (глобальная область)
let currentEditProduct = null;

document.addEventListener('DOMContentLoaded', function() {

// Функция открытия модального окна редактирования
function openEditProductModal(productData) {
    console.log('Открываем модальное окно редактирования с данными:', productData);
    
    if (!productData || !productData.sku) {
        console.error('Некорректные данные товара:', productData);
        return;
    }
    
    currentEditProduct = productData;
    
    // Заполняем форму данными товара
    const nameField = document.getElementById('editProductName');
    const nameEngField = document.getElementById('editProductNameEng');
    const brandField = document.getElementById('editProductBrand');
    const skuField = document.getElementById('editProductSku');
    const currentSkuField = document.getElementById('editProductCurrentSku');
    const eanField = document.getElementById('editProductEan');
    
    console.log('Заполняем поля формы:');
    console.log('- name:', productData.name);
    console.log('- name_eng:', productData.name_eng);
    console.log('- brand:', productData.brand);
    console.log('- ean:', productData.ean);
    
    if (nameField) nameField.value = productData.name || '';
    if (nameEngField) nameEngField.value = productData.name_eng || '';
    if (brandField) brandField.value = productData.brand || '';
    if (skuField) skuField.value = productData.sku || '';
    if (currentSkuField) currentSkuField.textContent = productData.sku || '';
    if (eanField) eanField.value = productData.ean || '';
    
    // Устанавливаем текущее изображение
    const imagePreview = document.getElementById('editProductImagePreview');
    if (productData.image_url) {
        imagePreview.innerHTML = `<img src="${productData.image_url}" alt="Current" class="max-w-full max-h-full object-contain">`;
    } else {
        imagePreview.innerHTML = `
            <svg class="w-8 h-8 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
        `;
    }
    
    // Сбрасываем файл изображения
    document.getElementById('editProductImage').value = '';
    
    // Показываем модальное окно
    document.getElementById('editProductModal').classList.remove('hidden');
    
    // Блокируем прокрутку страницы
    document.body.style.overflow = 'hidden';
}

// Функция закрытия модального окна
function closeEditProductModal() {
    document.getElementById('editProductModal').classList.add('hidden');
    document.body.style.overflow = '';
    currentEditProduct = null;
}

// Закрытие модального окна при клике вне его теперь обрабатывается через onclick атрибуты

// Закрытие модального окна по клавише ESC
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && !document.getElementById('editProductModal').classList.contains('hidden')) {
        closeEditProductModal();
    }
});

// Предпросмотр нового изображения
document.getElementById('editProductImage').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('editProductImagePreview').innerHTML = `<img src="${e.target.result}" alt="Preview" class="max-w-full max-h-full object-contain">`;
        };
        reader.readAsDataURL(file);
    }
});

// Обработка отправки формы
document.getElementById('editProductModalForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    console.log('Обработчик формы вызван, currentEditProduct:', currentEditProduct);
    
    if (!currentEditProduct) {
        console.error('Нет данных о редактируемом товаре, currentEditProduct:', currentEditProduct);
        return;
    }
    
    console.log('SKU редактируемого товара:', currentEditProduct.sku);
    
    const submitBtn = document.getElementById('editProductSubmitBtn');
    const submitText = document.getElementById('editProductSubmitText');
    const submitSpinner = document.getElementById('editProductSubmitSpinner');
    
    // Показываем индикатор загрузки
    submitBtn.disabled = true;
    submitText.textContent = 'Сохранение...';
    submitSpinner.classList.remove('hidden');
    
    const formData = new FormData(this);
    
    try {
        const response = await fetch(`/api/products/${currentEditProduct.sku}`, {
            method: 'PUT',
            body: formData
        });
        
        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.detail || 'Ошибка при обновлении товара');
        }
        
        const result = await response.json();
        if (result.success) {
            // Показываем уведомление об успехе
            if (typeof window.showNotification === 'function') {
                window.showNotification('Товар успешно обновлен!', 'success');
            } else {
                alert('Товар успешно обновлен!');
            }
            
            // Сохраняем SKU перед закрытием модального окна
            const oldSku = currentEditProduct.sku;
            
            // Закрываем модальное окно
            closeEditProductModal();
            
            // Обновляем карточку товара
            await refreshProductCard(oldSku, result.sku);
            
        }
    } catch (error) {
        console.error('Ошибка:', error);
        if (typeof window.showNotification === 'function') {
            window.showNotification(error.message || 'Произошла ошибка при обновлении товара. Пожалуйста, попробуйте еще раз.', 'error');
        } else {
            alert(error.message || 'Произошла ошибка при обновлении товара. Пожалуйста, попробуйте еще раз.');
        }
    } finally {
        // Скрываем индикатор загрузки
        submitBtn.disabled = false;
        submitText.textContent = 'Сохранить изменения';
        submitSpinner.classList.add('hidden');
    }
});

// Функция обновления карточки товара
async function refreshProductCard(oldSku, newSku) {
    try {
        // Получаем обновленные данные товара используя существующий роут
        const response = await fetch(`/catalog_new/api/products/${newSku}/card`);
        if (response.ok) {
            const data = await response.json();
            
            // Находим все карточки с данным SKU
            const cards = document.querySelectorAll(`[data-product-sku="${oldSku}"]`);
            cards.forEach(card => {
                const productCard = card.closest('.product-card');
                if (productCard) {
                    // Заменяем HTML карточки
                    productCard.outerHTML = data.html;
                    
                    // Переинициализируем обработчики для новой карточки
                    if (typeof window.reinitializeCardHandlers === 'function') {
                        window.reinitializeCardHandlers();
                    }
                }
            });
            
            // Если SKU изменился, обновляем данные в воркспейсе
            if (oldSku !== newSku && typeof window.workspaceManager !== 'undefined' && window.workspaceManager) {
                const workspaceData = window.workspaceManager.selectedProducts[oldSku];
                if (workspaceData) {
                    // Обновляем SKU в данных воркспейса
                    workspaceData.sku = newSku;
                    delete window.workspaceManager.selectedProducts[oldSku];
                    window.workspaceManager.selectedProducts[newSku] = workspaceData;
                    window.workspaceManager.saveToStorage();
                }
            }
            
            console.log(`Карточка товара ${oldSku} обновлена`);
        }
    } catch (error) {
        console.error('Ошибка при обновлении карточки товара:', error);
    }
}

// Делаем функции глобальными для доступа из других частей кода
window.openEditProductModal = openEditProductModal;
window.closeEditProductModal = closeEditProductModal;
window.refreshProductCard = refreshProductCard;

}); // Конец DOMContentLoaded
</script>
