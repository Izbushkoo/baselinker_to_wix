<div class="flex flex-wrap gap-3 mb-6 justify-end">
    <button onclick="performStockDeduction()"
        class="inline-flex items-center justify-center px-4 py-3 border border-green-200 rounded text-sm font-medium text-green-700 bg-green-50 hover:bg-green-100 focus:outline-none focus:ring-2 focus:ring-green-500 transition-colors duration-200">
        Провести операцию списания
    </button>

    <button onclick="cancelOperation()"
        class="inline-flex items-center justify-center px-4 py-3 border border-red-200 rounded text-sm font-medium text-red-700 bg-red-50 hover:bg-red-100 focus:outline-none focus:ring-2 focus:ring-red-500 transition-colors duration-200" 
        title="Функционал будет реализован позже">
        Отменить операцию списания
    </button>

    <button id="productsToggleBtn" onclick="toggleProductsPanel()"
        class="inline-flex items-center px-4 py-2 border border-gray-400 rounded-md shadow-sm text-sm font-medium text-gray-500 bg-gray-200 hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400 transition-colors duration-200">
        <span>Товары</span>
        <svg id="productsToggleIcon" class="w-4 h-4 ml-2 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="transform: rotate(180deg);">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
        </svg>
    </button>
</div>
